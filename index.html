    .map(k => `<option value="${k}"${k === use ? ' selected' : ''}>${tr(PARTS[k])}</option>`)
    .join('');
  return `<select data-part="${key}"${use === key ? '' : ' class="swapped"'}
    title="${t('bomAltTip')}">${opts}</select>`;
}

function updateBOM() {
  const name = armName();
  armNameEl.textContent = `🦾 ${tr(name)}`;

  const groups = bomGroups();
  if (!groups.length) {
    bomTable.innerHTML = `<tr><td>${t('bomEmpty')}</td></tr>`;
    return;
  }

  let html = `<tr>
    <th>${t('colName')}</th>
    <th class="num">${t('colQty')}</th>
    <th class="num">${t('colPrice')}</th>
    <th class="num">${t('colSum')}</th>
  </tr>`;
  let total = 0;

  for (const g of groups) {
    let rows = '', sub = 0;
    for (const key of Object.keys(PARTS)) {
      const n = g.parts[key];
      if (!n) continue;
      const price = PARTS[usedPart(key)].price;
      sub += n * price;
      rows += `<tr>
        <td>${partCell(key)}</td>
        <td class="num">${n}</td>
        <td class="num">${fmt$(price)}</td>
        <td class="num">${fmt$(n * price)}</td>
      </tr>`;
    }
    if (!rows) continue;
    total += sub;
    html += `<tr class="group">
      <td colspan="3">${g.label}${g.count > 1 ? ` <span class="mult">×${g.count}</span>` : ''}</td>
      <td class="num">${fmt$(sub)}</td>
    </tr>${rows}`;
  }

  html += `<tr class="total">
    <td colspan="3">${t('total')}</td>
    <td class="num">${fmt$(total)}</td>
  </tr>`;
  bomTable.innerHTML = html;

  for (const sel of bomTable.querySelectorAll('select')) {
    sel.onchange = () => {
      const key = sel.dataset.part;
      if (sel.value === key) delete swaps[key]; else swaps[key] = sel.value;
      updateBOM();
    };
  }
}

/* ================= JSON ================= */

const jsonText = document.getElementById('jsonText');
const jsonStatus = document.getElementById('jsonStatus');

/* @pure config */
function cleanConfig(list = components) {
  return list.map(c => {
    const out = { type: c.type };
    for (const p of TYPES[c.type].params) {
      const v = c[p.key] ?? p.def;
      /* во время анимации значения плавающие — в JSON без длинных хвостов */
      out[p.key] = typeof v === 'number' ? +v.toFixed(2) : v;
    }
    return out;
  });
}
/* @pure end */

function updateJSONView() {
  if (document.activeElement === jsonText) return; // не мешаем ручному редактированию
  jsonText.value = JSON.stringify(cleanConfig(), null, 2);
}

function flashStatus(el, text, cls) {
  el.textContent = text;
  el.className = cls || '';
  if (text) setTimeout(() => { if (el.textContent === text) { el.textContent = ''; el.className = ''; } }, 3000);
}

function setStatus(text, cls) { flashStatus(jsonStatus, text, cls); }

/* @pure validate */
/* Валидация конфигурации (Apply и ?config= из URL): неизвестный тип — ошибка,
   значения зажимаются в min/max, пропущенные параметры добираются из def */
function validateConfig(data) {
  if (!Array.isArray(data)) throw new Error(t('errArray'));
  for (const [i, c] of data.entries()) {
    if (!c || !TYPES[c.type]) throw new Error(t('errType', i + 1, c && c.type));
    for (const p of TYPES[c.type].params) {
      if (c[p.key] === undefined) c[p.key] = p.def;
      c[p.key] = Math.min(p.max, Math.max(p.min, +c[p.key] || 0));
    }
    for (const p of TYPES[c.type].params) c[p.key] = Math.min(c[p.key], paramMax(c, p)); // ext ≤ length
  }
  return data;
}
/* @pure end */

document.getElementById('btnApply').onclick = () => {
  try {
    const data = validateConfig(JSON.parse(jsonText.value));
    cancelTutorial();
    pushUndo();
    withLog(() => { components = data; buildArm(); renderPanel(); });
    setStatus(t('applied'), 'ok');
  } catch (e) {
    setStatus(t('errPrefix', e.message), 'err');
  }
};

/* Копирование в буфер: clipboard API → временная textarea (execCommand;
   выделять #jsonText нельзя — на мобильных его вкладка скрыта и select()
   не срабатывает) → системная шторка «Поделиться», если и это не вышло */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { /* дальше фолбэк */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.readOnly = true;
  /* font-size 16px — iOS не зумит страницу при фокусе */
  ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0;font-size:16px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length); // iOS игнорирует select()
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { /* нет execCommand */ }
  ta.remove();
  if (!ok && navigator.share) {
    try {
      await navigator.share(/^https?:/.test(text) ? { url: text } : { text });
      ok = true;
    } catch { /* пользователь закрыл шторку */ }
  }
  return ok;
}

document.getElementById('btnCopy').onclick = async () => {
  if (await copyText(jsonText.value)) setStatus(t('copied'), 'ok');
};

/* @pure codec */
/* ---- Цифровой код руки: любой конфигурации соответствует число ----
   Формат (версия 1): первая цифра — версия, дальше на каждый компонент
   цифра-код типа (TYPES[*].code) и его параметры фиксированной ширины,
   нормированные в целое: idx = round((v - min) / step), ширина — по числу
   цифр в максимальном idx. Разделители в коде допускаются любые нецифровые
   (группы 4227-8474-... для удобной диктовки) и отсекаются перед разбором. */

/* Версии формата: 1 — типы одной цифрой (коды 0–9), 2 — типы двумя цифрами
   (00–99, для новых типов с кодами 10+), 3 — как 2, но у телескопа два параметра
   (length и ext до 2). Энкодер выбирает минимально достаточную версию, декодер
   читает все. */
const CODE_VERSIONS = { 1: 1, 2: 2, 3: 2, 4: 1, 5: 2 }; // версия → ширина кода типа в цифрах
/* 4 и 5 — структурный код с габаритами (?s=): типы + build-параметры (длины),
   позы по умолчанию; 4 — типы одной цифрой, 5 — двумя. Версии 1–3 в ?s= —
   старые структурные коды без размеров. */
const STRUCT_SIZED = { 4: true, 5: true };

/* параметры типов в старых версиях (заморожены): в v1/v2 у телескопа был только ext */
const LEGACY_PARAMS = {
  prismatic: [{ key: 'ext', min: 0, max: 1.2, step: 0.05, def: 0.4 }],
};
function codecParams(type, ver) {
  return (ver < 3 && LEGACY_PARAMS[type]) || TYPES[type].params;
}

/* сколько цифр занимает параметр в коде */
function paramDigits(p) {
  return String(Math.round((p.max - p.min) / p.step)).length;
}

const CODE_TO_TYPE = Object.fromEntries(
  Object.entries(TYPES).map(([type, ty]) => [String(ty.code), type]));

/* Контрольная цифра по алгоритму Дамма — ловит все одиночные опечатки и все
   перестановки соседних цифр (Лун пропускал 09↔90). Считается по всем цифрам
   кода (включая версию) и дописывается в конец. Таблица — квазигруппа Дамма. */
const DAMM = [
  [0, 3, 1, 7, 5, 9, 8, 6, 4, 2],
  [7, 0, 9, 2, 1, 5, 4, 8, 6, 3],
  [4, 2, 0, 6, 8, 7, 1, 3, 5, 9],
  [1, 7, 5, 0, 9, 8, 3, 4, 2, 6],
  [6, 1, 2, 3, 0, 4, 5, 9, 7, 8],
  [3, 6, 7, 4, 2, 0, 9, 5, 8, 1],
  [5, 8, 6, 9, 7, 2, 0, 1, 3, 4],
  [8, 9, 4, 5, 3, 6, 2, 0, 1, 7],
  [9, 4, 3, 8, 6, 1, 7, 2, 0, 5],
  [2, 5, 8, 1, 4, 3, 6, 7, 9, 0],
];
function dammDigit(digits) {
  let i = 0;
  for (const ch of digits) i = DAMM[i][+ch];
  return String(i);
}
/* свойство квазигруппы: строка вместе с контрольной цифрой сворачивается в 0 */
function dammValid(digits) {
  return digits.length > 1 && dammDigit(digits) === '0';
}

/* нормализация ввода: любые разделители отсекаются; затем проверка Дамма и
   версии; возвращает {tw: ширина кода типа, body: тело без версии и
   контрольной цифры} либо null */
function codeBody(str) {
  const d = String(str).replace(/\D+/g, '');
  /* минимум 2 цифры: версия + контрольная (пустое тело = пустая рука) */
  if (d.length < 2 || !CODE_VERSIONS[d[0]] || !dammValid(d)) return null;
  return { ver: +d[0], tw: CODE_VERSIONS[d[0]], body: d.slice(1, -1) };
}

/* минимально достаточная версия: 3 — если есть телескоп (его параметры изменились),
   2 — если есть типы с кодами 10+, иначе 1 */
function codeVersionFor(list) {
  if (list.some(c => LEGACY_PARAMS[c.type])) return '3';
  return list.some(c => TYPES[c.type].code > 9) ? '2' : '1';
}

function encodeArmCode(cfg = cleanConfig()) {
  const ver = codeVersionFor(cfg);
  const tw = CODE_VERSIONS[ver];
  let s = ver;
  for (const c of cfg) {
    const ty = TYPES[c.type];
    s += String(ty.code).padStart(tw, '0');
    for (const p of ty.params) {
      const v = Math.min(p.max, Math.max(p.min, c[p.key] ?? p.def));
      s += String(Math.round((v - p.min) / p.step)).padStart(paramDigits(p), '0');
    }
  }
  return s + dammDigit(s);
}

/* ---- Замороженная спецификация формата кода (см. CODEC.md) ----
   Коды типов и диапазоны/шаги параметров — часть протокола ссылок: их
   изменение молча ломает ВСЕ разосланные коды. Новые типы добавляются в
   конец с новыми кодами; менять существующие строки нельзя без новой версии.
   Самопроверка при старте кричит в консоль, если TYPES разошёлся со спекой. */
const CODE_SPEC = {
  /* v1: коды 0–9 */
  0: 'yaw|angle:-180:180:1:3',
  1: 'pitch|angle:-120:120:1:3',
  2: 'roll|angle:-180:180:1:3',
  3: 'link|length:0.3:3:0.05:2',
  4: 'gripper|open:0:100:1:3',
  5: 'prismatic|length:0.3:2:0.05:2|ext:0:2:0.05:2', // с v3; в v1/v2 — см. CODE_SPEC_LEGACY
  6: 'spherical|pitch:-90:90:1:3|yaw:-180:180:1:3',
  7: 'offset|length:0.2:1.5:0.05:2',
  8: 'rail|pos:-2:2:0.05:2',
  9: 'suction|power:0:100:1:3',
  /* v2: коды 10+ (двухзначные) */
  10: 'drill|speed:0:100:1:3',
  11: 'mill|speed:0:100:1:3',
};

/* строки прежних версий, по которым декодируются старые ссылки (LEGACY_PARAMS) */
const CODE_SPEC_LEGACY = { 5: 'prismatic|ext:0:1.2:0.05:2' };

function checkCodeSpec() {
  const errors = [];
  for (const [type, params] of Object.entries(LEGACY_PARAMS)) {
    const actual = type + '|' + params.map(p => [p.key, p.min, p.max, p.step, paramDigits(p)].join(':')).join('|');
    if (CODE_SPEC_LEGACY[TYPES[type].code] !== actual) errors.push(`legacy code ${TYPES[type].code}: "${actual}"`);
  }
  for (const [type, ty] of Object.entries(TYPES)) {
    const actual = type + '|' + ty.params.map(p =>
      [p.key, p.min, p.max, p.step, paramDigits(p)].join(':')).join('|');
    if (CODE_SPEC[ty.code] !== actual) {
      errors.push(`code ${ty.code}: spec "${CODE_SPEC[ty.code]}" != actual "${actual}"`);
    }
  }
  if (Object.keys(TYPES).length !== Object.keys(CODE_SPEC).length) {
    errors.push('количество типов разошлось со спекой кода');
  }
  for (const e of errors) {
    console.error(`Robo-Arm CODEC нарушен — старые ссылки сломаются! ${e}\n`
      + 'Изменение кодов/min/max/step требует новой версии формата (см. CODEC.md).');
  }
  return !errors.length;
}

/* полный код (типы + параметры) → массив компонентов; null, если код битый */
function decodeArmCode(str) {
  const parsed = codeBody(str);
  if (parsed === null || STRUCT_SIZED[parsed.ver]) return null; // структурный код — не сюда
  const { ver, tw, body: d } = parsed;
  const out = [];
  let i = 0;
  while (i < d.length) {
    if (i + tw > d.length) return null;
    const type = CODE_TO_TYPE[String(parseInt(d.slice(i, i + tw), 10))];
    i += tw;
    if (!type) return null;
    const c = { type };
    for (const p of codecParams(type, ver)) {
      const w = paramDigits(p);
      if (i + w > d.length) return null; // код оборван
      const idx = Math.min(parseInt(d.slice(i, i + w), 10),
        Math.round((p.max - p.min) / p.step));
      i += w;
      const v = p.min + idx * p.step;
      c[p.key] = p.step >= 1 ? Math.round(v) : +v.toFixed(2);
    }
    out.push(c);
  }
  return out;
}

/* ---- Структурный код (?s=): только цифры типов, суперкороткий ----
   Параметры выставляются в середину диапазона — «нейтральная» поза. */

function midParam(p) {
  const steps = Math.round((p.max - p.min) / p.step);
  const v = p.min + Math.round(steps / 2) * p.step;
  return p.step >= 1 ? Math.round(v) : +v.toFixed(2);
}

function decodeStructCode(str) {
  const parsed = codeBody(str);
  if (parsed === null) return null;
  const { ver, tw, body: d } = parsed;
  const sized = !!STRUCT_SIZED[ver];
  const out = [];
  let i = 0;
  while (i < d.length) {
    if (i + tw > d.length) return null;
    const type = CODE_TO_TYPE[String(parseInt(d.slice(i, i + tw), 10))];
    i += tw;
    if (!type) return null;
    const c = { type };
    for (const p of codecParams(type, ver)) {
      if (sized && p.build) {
        /* габарит записан в коде */
        const w = paramDigits(p);
        if (i + w > d.length) return null;
        const idx = Math.min(parseInt(d.slice(i, i + w), 10), Math.round((p.max - p.min) / p.step));
        i += w;
        c[p.key] = +(p.min + idx * p.step).toFixed(2);
      } else c[p.key] = sized ? p.def : midParam(p); // позы: по умолчанию (старые коды — середина диапазона)
    }
    out.push(c);
  }
  return out;
}

/* короткий код: типы + габариты (длины), позы — по умолчанию */
function encodeStructCode(cfg = cleanConfig()) {
  const ver = cfg.some(c => TYPES[c.type].code > 9) ? '5' : '4';
  const tw = CODE_VERSIONS[ver];
  let s = ver;
  for (const c of cfg) {
    const ty = TYPES[c.type];
    s += String(ty.code).padStart(tw, '0');
    for (const p of ty.params) {
      if (!p.build) continue;
      const v = Math.min(p.max, Math.max(p.min, c[p.key] ?? p.def));
      s += String(Math.round((v - p.min) / p.step)).padStart(paramDigits(p), '0');
    }
  }
  return s + dammDigit(s);
}

/* группы по 4 цифры через дефис — легче диктовать и запоминать */
function groupCode(code) {
  return code.replace(/(\d{4})(?=\d)/g, '$1-');
}
/* @pure end */

/* ---- Ссылка на текущую конфигурацию: цифровой код в параметре ?c= ---- */

/* Язык и тема попадают в ссылку, если заданы явно: пришли из ссылки при открытии
   или переключены в процессе работы (флаги langChosen/themeChosen). Иначе
   получатель откроет страницу со своими настройками. */
function shareExtras() {
  return (langChosen ? `&lang=${lang}` : '') + (themeChosen ? `&theme=${theme}` : '');
}
function shareURL() {
  return `${SHARE_BASE}?c=${groupCode(encodeArmCode())}${shareExtras()}`;
}
function structShareURL() {
  return `${SHARE_BASE}?s=${groupCode(encodeStructCode())}${shareExtras()}`;
}

/* Клик — короткая ссылка (?s=, только состав, позы по умолчанию: её легко
   запомнить и продиктовать), долгое нажатие (≥600 мс) — полная (?c=, с позами
   и длинами). Обе сразу уходят в буфер обмена. */
const btnShare = document.getElementById('btnShare');
const LONG_PRESS_MS = 600;
let sharePressTimer = null;
let shareLongFired = false;

async function copyShare(struct) {
  if (!await copyText(struct ? structShareURL() : shareURL())) return;
  btnShare.textContent = t(struct ? 'shortCopied' : 'shareCopied');
  btnShare.classList.add('done');
  setTimeout(() => {
    btnShare.textContent = t('share');
    btnShare.classList.remove('done');
  }, 2000);
}

btnShare.onclick = () => {
  if (shareLongFired) { shareLongFired = false; return; } // клик после долгого нажатия
  copyShare(true);
};
btnShare.addEventListener('pointerdown', () => {
  shareLongFired = false;
  clearTimeout(sharePressTimer);
  sharePressTimer = setTimeout(() => { shareLongFired = true; copyShare(false); }, LONG_PRESS_MS);
});
for (const ev of ['pointerup', 'pointerleave', 'pointercancel']) {
  btnShare.addEventListener(ev, () => clearTimeout(sharePressTimer));
}
/* долгое касание на мобильных не должно открывать контекстное меню */
btnShare.addEventListener('contextmenu', e => e.preventDefault());

/* ================= URDF: описание руки для ROS ================= */

/* URDF (Unified Robot Description Format) — стандартное XML-описание робота:
   дерево звеньев (link), соединённых суставами (joint). Выгрузка полностью
   самодостаточна: геометрия — примитивы (cylinder/box/sphere), внешних мешей
   нет, файл открывается в RViz, MoveIt, Gazebo, PyBullet, urdf-loaders.

   Оси. В сцене three.js «вдоль руки» — локальный +Y, в URDF — +Z. Экспорт
   разворачивает систему на Rx(+90°): (x, y, z)_three → (x, −z, y)_urdf.
   Развороты вокруг X от этого не меняются, поэтому оси суставов простые:
   yaw/roll (three .rotation.y) → «0 0 1», pitch (.rotation.x) → «1 0 0»,
   знак угла тот же. Цилиндр в three лежит вдоль Y, в URDF — вдоль Z: после
   разворота осей это одна и та же ось, дополнительный rpy нужен только оси
   сустава pitch (она лежит поперёк, rpy «0 π/2 0»).

   Единицы: 1 единица сцены = URDF_SCALE метров, углы — радианы.
   Массы, тензоры инерции и effort/velocity — оценочные (равномерная плотность
   URDF_DENSITY по объёму примитивов): для визуализации и кинематики этого
   достаточно, для динамики их нужно заменить настоящими (см. вкладку BOM).

   URDF описывает модель, а не позу, поэтому текущие значения слайдеров уходят
   в комментарий-шапку — оттуда их можно перенести в joint_states. */

const URDF_SCALE = 1;          // метров в одной единице сцены
const URDF_DENSITY = 400;      // кг/м³, «полая» конструкция — оценка массы
const URDF_NEUTRAL = 0x8a94a6; // корпусные детали (не зависят от темы UI)
const URDF_MARK = 0xe2e8f0;    // метки-риски на поворотных узлах

const urdfPane = document.getElementById('urdfarea');
const urdfText = document.getElementById('urdfText');
const urdfStatus = document.getElementById('urdfStatus');

/* ---- Примитивы: те же формы, что в buildArm(), но уже в осях URDF ---- */
const uCyl = (r, l, p, col, rpy) => ({ g: 'cylinder', r, l, p, col, rpy });
const uBox = (s, p, col, rpy) => ({ g: 'box', s, p, col, rpy });
const uSph = (r, p, col) => ({ g: 'sphere', r, p, col });
const uAdd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];

const uNum = v => (Math.abs(v) < 1e-9 ? '0' : String(+v.toFixed(5)));
const uLen = v => uNum(v * URDF_SCALE);
const uXYZ = p => p.map(uLen).join(' ');
const uRPY = r => (r ? r.map(uNum).join(' ') : '0 0 0');
const uRad = deg => deg * Math.PI / 180;

function uGeom(s) {
  if (s.g === 'cylinder') return `<cylinder radius="${uLen(s.r)}" length="${uLen(s.l)}"/>`;
  if (s.g === 'box') return `<box size="${s.s.map(uLen).join(' ')}"/>`;
  return `<sphere radius="${uLen(s.r)}"/>`;
}

const uMatName = col => 'c_' + col.toString(16).padStart(6, '0');

function uShape(s) {
  const org = `<origin xyz="${uXYZ(s.p)}" rpy="${uRPY(s.rpy)}"/>`;
  return `    <visual>\n      ${org}\n      <geometry>${uGeom(s)}</geometry>\n`
       + `      <material name="${uMatName(s.col)}"/>\n    </visual>\n`
       + `    <collision>\n      ${org}\n      <geometry>${uGeom(s)}</geometry>\n    </collision>`;
}

/* ---- Оценка масс-инерционных свойств звена по его примитивам ---- */

function uMass(s) {
  const S = URDF_SCALE;
  const vol = s.g === 'cylinder' ? Math.PI * (s.r * S) ** 2 * (s.l * S)
    : s.g === 'box' ? (s.s[0] * S) * (s.s[1] * S) * (s.s[2] * S)
      : 4 / 3 * Math.PI * (s.r * S) ** 3;
  return vol * URDF_DENSITY;
}

/* Диагональ собственного тензора в осях звена. Из разворотов в модели важен
   только цилиндр, положенный вдоль X (корпус сустава pitch); повороты вокруг Z
   у зубьев фрезы на диагональ влияют пренебрежимо. */
function uInertiaDiag(s, m) {
  const S = URDF_SCALE;
  if (s.g === 'box') {
    const [x, y, z] = s.s.map(v => v * S);
    return [m * (y * y + z * z) / 12, m * (x * x + z * z) / 12, m * (x * x + y * y) / 12];
  }
  if (s.g === 'sphere') { const i = 0.4 * m * (s.r * S) ** 2; return [i, i, i]; }
  const across = m * (3 * (s.r * S) ** 2 + (s.l * S) ** 2) / 12;
  const along = 0.5 * m * (s.r * S) ** 2;
  const alongX = s.rpy && Math.abs(Math.abs(s.rpy[1]) - Math.PI / 2) < 1e-6;
  return alongX ? [along, across, across] : [across, across, along];
}

/* Суммарные масса, центр масс и тензор (диагональ, теорема Гюйгенса–Штейнера).
   Пустое звено (промежуточное у шарового сустава, tool0) получает символическую
   массу — многие парсеры спотыкаются о звенья вообще без inertial. */
function uInertial(shapes) {
  if (!shapes.length) {
    return '    <inertial>\n      <mass value="0.001"/>\n'
         + '      <inertia ixx="1e-6" ixy="0" ixz="0" iyy="1e-6" iyz="0" izz="1e-6"/>\n    </inertial>\n';
  }
  let m = 0;
  let c = [0, 0, 0];
  for (const s of shapes) {
    const mi = uMass(s);
    m += mi;
    for (let k = 0; k < 3; k++) c[k] += mi * s.p[k] * URDF_SCALE;
  }
  c = c.map(v => v / m);
  let ixx = 0, iyy = 0, izz = 0;
  for (const s of shapes) {
    const mi = uMass(s);
    const [a, b, d] = uInertiaDiag(s, mi);
    const [dx, dy, dz] = [0, 1, 2].map(k => s.p[k] * URDF_SCALE - c[k]);
    ixx += a + mi * (dy * dy + dz * dz);
    iyy += b + mi * (dx * dx + dz * dz);
    izz += d + mi * (dx * dx + dy * dy);
  }
  return `    <inertial>\n      <origin xyz="${c.map(uNum).join(' ')}" rpy="0 0 0"/>\n`
       + `      <mass value="${uNum(m)}"/>\n`
       + `      <inertia ixx="${uNum(ixx)}" ixy="0" ixz="0" iyy="${uNum(iyy)}" iyz="0" izz="${uNum(izz)}"/>\n`
       + '    </inertial>\n';
}

/* ---- Имя робота и файла: латиница из английского названия руки ---- */
function urdfName() {
  return armName().en.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '') || 'robo_arm';
}

/* ---- Сборка URDF из цепочки components ---- */
function buildURDF() {
  const nodes = [];  // звенья и суставы в порядке цепочки
  const pose = [];   // текущие значения суставов — в комментарий-шапку
  let cur = { name: 'base_link', shapes: [] };
  nodes.push({ link: cur });
  cur.shapes.push(uCyl(gAvgR(GEOM.base.r), GEOM.base.h, [0, 0, GEOM.base.h / 2], URDF_NEUTRAL));
  let org = [0, 0, GEOM.base.h]; // точка крепления следующего компонента в осях cur

  /* Сустав + звено-потомок; дальше собираем в это новое звено */
  function joint(name, type, child, at, axis, lower, upper, effort, vel, mimic) {
    const x = [`  <joint name="${name}" type="${type}">`,
      `    <parent link="${cur.name}"/>`,
      `    <child link="${child}"/>`,
      `    <origin xyz="${uXYZ(at)}" rpy="0 0 0"/>`];
    if (axis) x.push(`    <axis xyz="${axis.join(' ')}"/>`);
    if (type === 'revolute' || type === 'prismatic') {
      x.push(`    <limit lower="${uNum(lower)}" upper="${uNum(upper)}" effort="${effort}" velocity="${vel}"/>`);
    } else if (type === 'continuous') {
      x.push(`    <limit effort="${effort}" velocity="${vel}"/>`);
    }
    if (mimic) x.push(`    <mimic joint="${mimic}" multiplier="1" offset="0"/>`);
    x.push('  </joint>');
    nodes.push({ xml: x.join('\n') });
    cur = { name: child, shapes: [] };
    nodes.push({ link: cur });
    return cur;
  }

  components.forEach((c, i) => {
    const ty = TYPES[c.type];
    const k = i + 1;
    const jn = `joint_${k}_${c.type}`, ln = `link_${k}_${c.type}`;

    if (c.type === 'yaw' || c.type === 'roll') {
      const h = ty.height, p = ty.params[0];
      const L = joint(jn, 'revolute', ln, org, [0, 0, 1], uRad(p.min), uRad(p.max), 10, 2);
      pose.push([jn, uRad(c.angle ?? 0)]);
      const G = GEOM[c.type], gm = G.mark;
      L.shapes.push(uCyl(gAvgR(G.body), h, [0, 0, h / 2], ty.color));
      L.shapes.push(uBox([gm.w, gm.d, h * gm.hFrac], [0, -gm.z, h / 2], URDF_MARK));
      org = [0, 0, h];

    } else if (c.type === 'pitch') {
      /* корпус-ось и крышки не вращаются — остаются на звене-родителе */
      const h = ty.height, p = ty.params[0], axleRPY = [0, Math.PI / 2, 0];
      const G = GEOM.pitch;
      cur.shapes.push(uCyl(G.axle.r, G.axle.len, uAdd(org, [0, 0, h / 2]), ty.color, axleRPY));
      cur.shapes.push(uCyl(G.cap.r, G.cap.w, uAdd(org, [G.cap.x, 0, h / 2]), URDF_NEUTRAL, axleRPY));
      cur.shapes.push(uCyl(G.cap.r, G.cap.w, uAdd(org, [-G.cap.x, 0, h / 2]), URDF_NEUTRAL, axleRPY));
      joint(jn, 'revolute', ln, uAdd(org, [0, 0, h / 2]), [1, 0, 0], uRad(p.min), uRad(p.max), 10, 2);
      pose.push([jn, uRad(c.angle ?? 0)]);
      org = [0, 0, h / 2];

    } else if (c.type === 'link') {
      /* звено — статика: отдельный сустав не нужен, форма идёт в текущее звено */
      const len = c.length ?? 1;
      cur.shapes.push(uCyl(gAvgR(GEOM.link.r), len, uAdd(org, [0, 0, len / 2]), ty.color));
      org = uAdd(org, [0, 0, len]);

    } else if (c.type === 'offset') {
      const len = c.length ?? 0.5, G = GEOM.offset;
      cur.shapes.push(uBox([G.block, G.block, G.block], uAdd(org, [0, 0, G.block / 2]), ty.color));
      cur.shapes.push(uBox([G.arm.w, len + G.arm.extra, G.arm.h], uAdd(org, [0, -len / 2, G.arm.y]), ty.color));
      org = uAdd(org, [0, -len, G.endY]);

    } else if (c.type === 'prismatic') {
      const p = ty.params.find(q => q.key === 'ext'), len = c.length ?? 0.7;
      cur.shapes.push(uCyl(gAvgR(GEOM.prismatic.body), len, uAdd(org, [0, 0, len / 2]), ty.color));
      const L = joint(jn, 'prismatic', ln, org, [0, 0, 1],
        p.min * URDF_SCALE, paramMax(c, p) * URDF_SCALE, 100, 0.5);
      pose.push([jn, Math.min(c.ext ?? p.def, len) * URDF_SCALE]);
      L.shapes.push(uCyl(GEOM.prismatic.rod, len, [0, 0, len / 2], URDF_NEUTRAL));
      org = [0, 0, len];

    } else if (c.type === 'spherical') {
      /* шарового сустава в URDF нет: два revolute + промежуточное звено */
      const [pPitch, pYaw] = ty.params, G = GEOM.spherical;
      cur.shapes.push(uCyl(gAvgR(G.socket.r), G.socket.h, uAdd(org, [0, 0, G.socket.h / 2]), URDF_NEUTRAL));
      cur.shapes.push(uSph(G.ball.r, uAdd(org, [0, 0, G.ball.y]), ty.color));
      joint(`joint_${k}_ball_yaw`, 'revolute', `link_${k}_ball_yaw`,
        uAdd(org, [0, 0, G.ball.y]), [0, 0, 1], uRad(pYaw.min), uRad(pYaw.max), 10, 2);
      pose.push([`joint_${k}_ball_yaw`, uRad(c.yaw ?? 0)]);
      const L = joint(`joint_${k}_ball_pitch`, `revolute`, `link_${k}_ball`,
        [0, 0, 0], [1, 0, 0], uRad(pPitch.min), uRad(pPitch.max), 10, 2);
      pose.push([`joint_${k}_ball_pitch`, uRad(c.pitch ?? 0)]);
      L.shapes.push(uCyl(G.stub.r, G.stub.len, [0, 0, G.stub.len / 2], URDF_NEUTRAL));
      org = [0, 0, G.stub.len];

    } else if (c.type === 'rail') {
      const p = ty.params[0], G = GEOM.rail;
      cur.shapes.push(uBox([G.track[0], G.track[2], G.track[1]], uAdd(org, [0, 0, G.track[1] / 2]), URDF_NEUTRAL));
      const L = joint(jn, 'prismatic', ln, org, [1, 0, 0],
        p.min * URDF_SCALE, p.max * URDF_SCALE, 200, 0.5);
      pose.push([jn, (c.pos ?? 0) * URDF_SCALE]);
      L.shapes.push(uBox([G.car[0], G.car[2], G.car[1]], [0, 0, G.carY], ty.color));
      org = [0, 0, G.attach];

    } else if (c.type === 'gripper') {
      /* пальцы — две призматические оси; правая повторяет левую через mimic */
      const base = cur, at = org, G = GEOM.gripper, gMin = G.gap0, gMax = G.gap0 + G.gapRange;
      const gap = gripGap(c);
      const finger = [G.finger[0], G.finger[2], G.finger[1]];
      cur.shapes.push(uBox([G.palm[0], G.palm[2], G.palm[1]], uAdd(org, [0, 0, G.palm[1] / 2]), URDF_NEUTRAL));
      const lj = `joint_${k}_finger_left`;
      joint(lj, 'prismatic', `link_${k}_finger_left`, at, [1, 0, 0],
        gMin * URDF_SCALE, gMax * URDF_SCALE, 20, 0.05)
        .shapes.push(uBox(finger, [0, 0, G.fingerY], ty.color));
      pose.push([lj, gap * URDF_SCALE]);
      cur = base;
      const rj = `joint_${k}_finger_right`;
      joint(rj, 'prismatic', `link_${k}_finger_right`, at, [-1, 0, 0],
        gMin * URDF_SCALE, gMax * URDF_SCALE, 20, 0.05, lj)
        .shapes.push(uBox(finger, [0, 0, G.fingerY], ty.color));
      pose.push([rj, gap * URDF_SCALE]);
      cur = base;
      org = uAdd(at, [0, 0, ty.height]);

    } else if (c.type === 'suction') {
      const G = GEOM.suction;
      cur.shapes.push(uCyl(gAvgR(G.body.r), G.body.h, uAdd(org, [0, 0, G.body.h / 2]), URDF_NEUTRAL));
      /* конуса в URDF нет — манжета приближена цилиндром (без учёта присоса) */
      cur.shapes.push(uCyl(G.cup.r, G.cup.h, uAdd(org, [0, 0, G.body.h + G.cup.h / 2]), ty.color));
      org = uAdd(org, [0, 0, G.attach]);

    } else if (c.type === 'drill' || c.type === 'mill') {
      /* шпиндель крутится без ограничений — continuous */
      const base = cur, drill = c.type === 'drill', GD = GEOM.drill, GM = GEOM.mill;
      const holder = drill ? GD.body : GM.stem; // корпус дрели / шток фрезы — до шпинделя
      const at = uAdd(org, [0, 0, drill ? GD.body.h : GM.spinY]);
      const sj = `joint_${k}_spindle`;
      cur.shapes.push(uCyl(gAvgR(holder.r), holder.h, uAdd(org, [0, 0, holder.h / 2]), URDF_NEUTRAL));
      const L = joint(sj, 'continuous', `link_${k}_${drill ? 'bit' : 'cutter'}`,
        at, [0, 0, 1], null, null, 3, 30);
      pose.push([sj, 0]);
      if (drill) {
        L.shapes.push(uCyl(gAvgR(GD.bit.r), GD.bit.len, [0, 0, GD.bit.len / 2], ty.color));
        L.shapes.push(uBox([GD.flute[0], GD.flute[2], GD.flute[1]], [0, 0, GD.fluteY], URDF_NEUTRAL));
      } else {
        const T = GM.teeth;
        L.shapes.push(uCyl(GM.disk.r, GM.disk.h, [0, 0, 0], ty.color));
        for (let q = 0; q < T.n; q++) {
          const a = q / T.n * Math.PI * 2;
          L.shapes.push(uBox([T.size, T.size, T.size],
            [Math.cos(a) * T.r, -Math.sin(a) * T.r, 0], ty.color, [0, 0, -a]));
        }
      }
      cur = base;
      org = uAdd(org, [0, 0, drill ? GD.attach : GM.attach]);
    }
  });

  /* Рабочая точка на конце руки — общепринятый tool0 из ROS-Industrial */
  joint('joint_tool0', 'fixed', 'tool0', org, null);

  const links = nodes.filter(n => n.link).map(n => n.link);
  const materials = [...new Set(links.flatMap(L => L.shapes.map(s => s.col)))].map(col => {
    const rgb = [16, 8, 0].map(sh => (((col >> sh) & 255) / 255).toFixed(3));
    return `  <material name="${uMatName(col)}">\n    <color rgba="${rgb.join(' ')} 1"/>\n  </material>`;
  }).join('\n');

  const body = nodes.map(n => n.xml ?? (
    `  <link name="${n.link.name}">\n${uInertial(n.link.shapes)}`
    + (n.link.shapes.length ? n.link.shapes.map(uShape).join('\n') + '\n' : '')
    + '  </link>'
  )).join('\n');

  const head = [
    `  Generated by Robo-Arm Builder v${VERSION} — ${armName().en}`,
    `  Source configuration: ${shareURL()}`,
    '',
    `  Units: meters, radians (1 builder unit = ${URDF_SCALE} m); Z points along the arm.`,
    `  Masses, inertias and joint effort/velocity are estimates (uniform density`,
    `  ${URDF_DENSITY} kg/m^3) — replace them with real values from the datasheets`,
    '  of the parts you actually buy (see the BOM tab).',
    '',
    '  Current pose (joint positions, rad / m):',
    ...(pose.length ? pose.map(([nm, v]) => `    ${nm} = ${uNum(v)}`) : ['    (no movable joints)']),
  ].join('\n');

  return `<?xml version="1.0"?>\n<!--\n${head}\n-->\n<robot name="${urdfName()}">\n`
       + (materials ? materials + '\n' : '') + body + '\n</robot>\n';
}

/* Невидимую вкладку не пересобираем — при переключении на неё вызов повторится */
function updateURDFView() {
  if (!urdfPane.classList.contains('active')) return;
  urdfText.value = buildURDF();
}

document.getElementById('btnUrdfCopy').onclick = async () => {
  if (await copyText(buildURDF())) flashStatus(urdfStatus, t('copied'), 'ok');
};

/* Сохранение файла: blob-ссылка работает и с file://; если браузер запретил —
   остаётся кнопка «Копировать» */
document.getElementById('btnUrdfSave').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buildURDF()], { type: 'application/xml' }));
  a.download = urdfName() + '.urdf';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  flashStatus(urdfStatus, t('saved'), 'ok');
};

/* ================= Отмена: откат структурных изменений руки ================= */

/* Снимки cleanConfig() перед каждым изменением состава (добавление, удаление,
   генерация, Apply, новый проект). Кнопка видна, только когда есть что отменять. */
const undoStack = [];
const btnUndo = document.getElementById('btnUndo');

function pushUndo() {
  const snap = JSON.stringify(cleanConfig());
  if (undoStack[undoStack.length - 1] === snap) return; // состав не менялся
  undoStack.push(snap);
  if (undoStack.length > 50) undoStack.shift();
  btnUndo.hidden = false;
}

btnUndo.onclick = () => {
  if (!undoStack.length) return;
  cancelTutorial();
  const snap = undoStack.pop();
  btnUndo.hidden = !undoStack.length;
  withLog(() => { components = JSON.parse(snap); buildArm(); renderPanel(); });
};

/* Восстановление руки из ссылки: ?c= — цифровой код (основной формат),
   ?s= — структурный код, ?config= — base64url(JSON), старые ссылки.
   Работает и через #hash. Если параметр есть, но битый — стартуем с ПУСТОЙ
   руки: демо-рука вводила бы в заблуждение, будто её собрал этот код. */
let badLink = false;
function loadFromURL() {
  const code = urlParam('c'), struct = urlParam('s'), legacy = urlParam('config');
  if (code === null && struct === null && legacy === null) return false;
  try {
    let data;
    if (code !== null) data = decodeArmCode(code);
    else if (struct !== null) data = decodeStructCode(struct);
    else data = JSON.parse(atob(legacy.replace(/-/g, '+').replace(/_/g, '/')));
    components = validateConfig(data); // null/битое — бросит исключение
    return true;
  } catch {
    badLink = true;
    components = [];
    return false;
  }
}

/* значение, приведённое к шагу слайдера (для подписей и фиксации поз) */
function quantParam(v, p) { return p.step >= 1 ? Math.round(v) : +v.toFixed(2); }

chkAnimate.onchange = () => {
  syncAnimToggle();
  if (chkAnimate.checked) {
    /* анимация качается вокруг текущих поз */
    for (const c of components) delete c._anim;
  } else {
    /* при остановке — привести плавающие значения анимации к шагу слайдера */
    for (const c of components) {
      for (const p of TYPES[c.type].params) {
        if (p.build || typeof c[p.key] !== 'number') continue;
        applyParamChecked(c, p.key, quantParam(c[p.key], p)); // округление не должно увести под пол
        const s = c._sliders?.[p.key];
        if (s) { s.slider.value = c[p.key]; s.val.textContent = quantParam(c[p.key], p); }
      }
    }
    updateJSONView(); // зафиксировать финальные значения
    updateURDFView();
  }
};

let lastAnimNow = 0;
function animateArm(now) {
  const dt = lastAnimNow ? Math.min(0.05, Math.max(0, (now - lastAnimNow) / 1000)) : 0;
  lastAnimNow = now;
  components.forEach((c, i) => {
    const params = TYPES[c.type].params.filter(p => !p.build); // габариты не анимируются
    if (!params.length) return;
    if (!c._anim) {
      /* качание вокруг текущих поз; фаза своя, чтобы у пола развернуться */
      c._anim = {};
      for (const p of params) c._anim[p.key] = { base: c[p.key] ?? p.def, phase: 0, dir: 1 };
    }
    for (const [j, p] of params.entries()) {
      const a = c._anim[p.key], max = paramMax(c, p);
      const amp = (max - p.min) * 0.25;
      const speed = 0.5 + ((i * 2 + j) % 4) * 0.22;
      a.phase += speed * dt * a.dir;
      const v = Math.min(max, Math.max(p.min, a.base + amp * Math.sin(a.phase + i * 1.3 + j * 2.1)));
      /* в 3D идёт точное значение — квантование до шага слайдера дёргало
         дальние звенья цепочки; округляем только подпись */
      const acc = applyParamChecked(c, p.key, v);
      if (acc !== v) {
        /* упёрлись в пол: колебание продолжается от принятого значения в обратную сторону */
        a.base += acc - v;
        a.dir = -a.dir;
      }
      const s = c._sliders?.[p.key];
      if (s) { s.slider.value = acc; s.val.textContent = quantParam(acc, p); }
    }
  });
  if (now - lastJsonSync > 300) { lastJsonSync = now; updateJSONView(); }
}

/* Диалоги: ask — два вопроса, about — «что это такое», done — поздравление */
function showTutModal(mode) {

btnHelp.onclick = () => showTutModal('ask');

function clearTutHighlight() {

}

function showTutStep(msgOverride) {
  clearTutHighlight();
  const type = TUTORIAL[tutStep];
  const btn = addRow.querySelector(`button[data-type="${type}"]`);
  if (btn) {
    btn.classList.add('tut-target');
    btn.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
  }
  const name = tr(TYPES[type].label);
  tutHint.innerHTML = `<span class="tut-exit" title="${t('tutExitTip')}">✕</span>`
    + `<span class="tut-step">${t('tutStepTitle', tutStep + 1, TUTORIAL.length)}</span><div></div>`;
  tutHint.lastChild.textContent = msgOverride ?? `${tr(TUT_FLAVOR[tutStep])} ${t('tutPress', name)}`;
  tutHint.querySelector('.tut-exit').onclick = cancelTutorial;
  tutHint.hidden = false;
}

function startTutorial() {
  hideTutModal();
  stopChallenge(); // задания и обучение одновременно не ведём
  document.body.classList.remove('expanded'); // панель кнопок должна быть видна
  btnExpand.classList.remove('on');
  setPanelCollapsed(true); // панель не должна закрывать руку (особенно на мобильных)
  if (components.length) pushUndo();
  components = [];

  tutStep++;
  if (tutStep >= TUTORIAL.length) {
    cancelTutorial();
    showTutModal('done');
    return;

  showTutStep();
}

/* ================= Challenge mode: три задания для собранной руки ================= */

/* Объекты заданий живут в chalRoot отдельно от руки: в JSON/URDF/BOM они не попадают.
   Состояние режима — chal (null = выключен). Задание 1 — кубик, плоское кольцо и
