<div id="addRow"></div>

<div id="viewport">
  <div id="vpTools">
    <button id="btnHelp">?</button>
    <label id="animToggle"><input type="checkbox" id="chkAnimate" checked><span id="animLbl">Animate</span></label>
    <button id="btnShare"></button>
    <button id="btnIK"></button>
    <button id="btnUndo" hidden></button>
  </div>
  <div id="tutHint" hidden></div>
  <div id="ikHint" hidden></div>
  <div id="camTools">
    <label id="fitToggle"><input type="checkbox" id="chkFit" checked><span id="fitLbl">Fit</span></label>
    <button id="btnPanel">▤</button>
    <button id="btnExpand">⛶</button>
  </div>
  <div id="startHint" hidden></div>
  <div id="chalPanel" hidden>
    <div class="chal-head"><span id="chalTitle"></span><span class="chal-min" id="chalMin">▼</span><span class="chal-close" id="chalClose">✕</span></div>
    <div class="chal-tasks" id="chalTasks"></div>
    <div class="chal-desc" id="chalDesc"></div>
    <div class="chal-status" id="chalStatus"></div>
    <div class="chal-actions" id="chalActions"></div>
  </div>
  <div id="chalTools"><button id="btnChal"></button></div>
  <div id="hint"></div>
</div>

<div id="sidebar">
  <div id="genRow">
    <button id="btnGenerate"></button>
    <button id="btnNew"></button>
  </div>
  <div id="tabs">
    <button data-tab="components" class="active"></button>
    <button data-tab="jsonarea"></button>
    <button data-tab="urdfarea"></button>
    <button data-tab="actarea"></button>
    <button data-tab="twinarea"></button>
    <button data-tab="bom"></button>
  </div>
  <div id="components" class="tabpane active"></div>
  <div id="jsonarea" class="tabpane">
    <div id="jsonbar">
      <span class="title" id="jsonTitle"></span>
      <span id="jsonStatus"></span>
      <button id="btnApply"></button>
      <button id="btnCopy"></button>
    </div>
    <textarea id="jsonText" spellcheck="false"></textarea>
  </div>
  <div id="urdfarea" class="tabpane">
    <div id="urdfbar">
      <span class="title" id="urdfTitle"></span>
      <span id="urdfStatus"></span>
      <button id="btnUrdfCopy"></button>
      <button id="btnUrdfSave"></button>
    </div>
    <textarea id="urdfText" spellcheck="false" readonly></textarea>
  </div>
  <div id="actarea" class="tabpane">
    <div id="actbar">
      <span class="title" id="actTitle"></span>
      <label id="actLoop"><input type="checkbox" id="chkLoop"><span id="loopLbl"></span></label>
      <button id="btnActUndo"></button>
      <button id="btnActReplay"></button>
    </div>
    <div id="actList"></div>
  </div>
  <div id="twinarea" class="tabpane">
    <div id="twinbar">
      <span class="title" id="twinTitle"></span>
      <span id="twinStatus"></span>
    </div>
    <div id="twinBody">
      <div class="note" id="twinNote"></div>
      <div class="twin-row">
        <input type="text" id="twinUrl" spellcheck="false" placeholder="ws://192.168.4.1/ws">
        <button id="btnTwinWs"></button>
      </div>
      <div class="twin-row" id="twinSerialRow">
        <input type="number" id="twinBaud" min="300" step="100" title="baud">
        <button id="btnTwinSerial"></button>
      </div>
      <div class="twin-row">
        <label><input type="checkbox" id="chkTwinSend" checked><span id="twinSendLbl"></span></label>
        <label><input type="checkbox" id="chkTwinRecv" checked><span id="twinRecvLbl"></span></label>
      </div>
      <div class="twin-row">
        <button id="btnTwinHome"></button>
        <button id="btnTwinStop"></button>
      </div>
      <table id="twinAxes"></table>
      <div class="note" id="twinProto"></div>
      <div id="twinLogHead"><span class="note" id="twinLogTitle"></span><button id="btnTwinLogClear"></button></div>
      <pre id="twinLog"></pre>
    </div>
  </div>
  <div id="bom" class="tabpane">
    <h2 id="bomTitle"></h2>
