<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robo-Arm Builder</title>
<style>
  /* Светлая тема — по умолчанию; светло-серые тона 3D-редакторов (3ds Max) */
  :root {
    color-scheme: light; /* нативные списки и скроллбары в тон теме */
    --bg: #e9eaec;
    --panel: #f3f4f6;
    --panel2: #e2e4e8;
    --border: #c2c6cc;
    --border-soft: rgba(120, 128, 138, .32);
    --text: #22262c;
    --muted: #666d77;
    --accent: #1f6fd0;
    --accent-soft: rgba(31, 111, 208, .14);
    --danger: #cf3a35;
    --ok: #1f8a52;
    --code: #2f6d2e;
    --overlay: rgba(243, 244, 246, .88);
  }
  /* Тёмная тема */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14171c;
    --panel: #1d222a;
    --panel2: #232a34;
    --border: #313a47;
    --border-soft: rgba(49, 58, 71, .45);
    --text: #e6ebf2;
    --muted: #8b97a8;
    --accent: #4da3ff;
    --accent-soft: rgba(77, 163, 255, .18);
    --danger: #ff5c5c;
    --ok: #57d98a;
    --code: #b9e3a6;
    --overlay: rgba(29, 34, 42, .82);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: auto auto 1fr;
    grid-template-areas:
      "header   header"
      "toolbar  sidebar"
      "viewport sidebar";
    height: 100vh;
    height: 100dvh; /* планшеты/мобильные: 100vh уходит под панель браузера */
    overflow: hidden;
  }
  #viewport { grid-area: viewport; position: relative; min-width: 0; min-height: 0; }
  #viewport canvas { display: block; }
  #hint {
    position: absolute; left: 12px; bottom: 44px; /* над кнопкой Challenge */
    color: var(--muted); font-size: 12px; pointer-events: none;
  }
  body.challenge #hint { display: none; }
  /* Инструменты 3D-окна: переключатель анимации + ссылка — левый верхний угол */
  #vpTools {
    position: absolute; left: 12px; top: 10px; z-index: 2;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  #animToggle, #btnShare, #btnUndo, #btnHelp {
    display: flex; align-items: center; gap: 8px;
    background: var(--overlay); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 13px;
    font: 600 13.5px/1.45 "Segoe UI", system-ui, sans-serif;
    color: var(--text); cursor: pointer;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .22);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  #animToggle:hover, #btnShare:hover, #btnUndo:hover, #btnHelp:hover { border-color: var(--accent); }
  #btnHelp { font-weight: 800; padding: 7px 12px; }
  /* долгое нажатие по «Ссылке»: без выделения текста и системного меню */
  #btnShare {
    user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; touch-action: manipulation;
  }
  #animToggle.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  #btnShare.done { border-color: var(--ok); color: var(--ok); }
  #btnUndo[hidden] { display: none; } /* display:flex перебивает атрибут hidden */

  /* Управление камерой — правый нижний угол 3D-окна, компактно */
  #camTools {
    position: absolute; right: 12px; bottom: 10px; z-index: 2;
    display: flex; gap: 8px;
  }
  #fitToggle, #btnExpand, #btnPanel {
    display: flex; align-items: center; gap: 6px;
    background: var(--overlay); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 9px;
    font: 600 12px/1.4 "Segoe UI", system-ui, sans-serif;
    color: var(--text); cursor: pointer;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .22);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  #fitToggle input { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; margin: 0; }
  #fitToggle:hover, #btnExpand:hover, #btnPanel:hover { border-color: var(--accent); }
  #fitToggle.on, #btnExpand.on, #btnPanel.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

  /* ---- Challenge mode: кнопка-тумблер и панель заданий — левый нижний угол 3D-окна ---- */
  #chalTools { position: absolute; left: 12px; bottom: 10px; z-index: 2; display: flex; gap: 8px; }
  #btnChal {
    display: flex; align-items: center; gap: 6px;
    background: var(--overlay); border: 1px solid var(--border);
    border-radius: 7px; padding: 5px 9px;
    font: 600 12px/1.4 "Segoe UI", system-ui, sans-serif;
    color: var(--text); cursor: pointer;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .22);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  #btnChal:hover { border-color: var(--accent); }
  #btnChal.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  #chalPanel {
    position: absolute; left: 12px; bottom: 46px; z-index: 3;
    width: 320px; max-width: calc(100% - 24px); max-height: calc(100% - 120px);
    overflow-y: auto;
    background: var(--overlay); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.45;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .3);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
    animation: hintIn .25s ease-out;
  }
  #chalPanel[hidden] { display: none; }
  .chal-head { display: flex; align-items: center; font-weight: 700; font-size: 13.5px; margin-bottom: 6px; }
  .chal-head .chal-close { margin-left: auto; cursor: pointer; color: var(--muted); font-weight: 700; padding: 0 4px; }
  .chal-head .chal-close:hover { color: var(--danger); }
  .chal-tasks { display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .chal-task { display: flex; gap: 6px; color: var(--muted); border-radius: 5px; padding: 1px 4px; margin: 0 -4px; }
  .chal-task:not(.cur) { cursor: pointer; }
  .chal-task:not(.cur):hover { color: var(--text); background: var(--accent-soft); }
  .chal-task.cur { color: var(--text); font-weight: 600; }
  .chal-task.done { color: var(--ok); }
  .chal-desc { margin-bottom: 6px; }
  .chal-status { color: var(--muted); }
  .chal-status .ok { color: var(--ok); font-weight: 600; }
  .chal-status .warn { color: var(--danger); }
  .chal-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chal-actions button {
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel2); color: var(--text);
    padding: 5px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .chal-actions button:hover { border-color: var(--accent); }
  .chal-actions button.primary { background: linear-gradient(135deg, #2b6cb0, #4da3ff); border-color: transparent; color: #fff; }
  /* во время воспроизведения записи рукой управляет журнал, а не пользователь */
  body.replaying #addRow, body.replaying #components, body.replaying #genRow,
  body.replaying #chalActions, body.replaying #btnUndo { pointer-events: none; opacity: .55; }
  /* вкладка «Запись» видна только в режиме заданий и заменяет JSON/URDF */
  #tabs button[data-tab="actarea"] { display: none; }
  body.challenge #tabs button[data-tab="actarea"] { display: block; }
  body.challenge #tabs button[data-tab="jsonarea"], body.challenge #tabs button[data-tab="urdfarea"] { display: none; }
  #actarea { background: var(--panel); }
  #actList { flex: 1; overflow-y: auto; padding: 6px 12px 10px; font-size: 12.5px; }
  .act {
    display: flex; gap: 8px; align-items: center;
    padding: 4px 6px; border-bottom: 1px solid var(--border-soft);
  }
  .act-n { color: var(--muted); min-width: 22px; text-align: right; font-variant-numeric: tabular-nums; }
  .act-txt .ico { vertical-align: -2px; margin-right: 2px; }
  .act.cur { background: var(--accent-soft); border-radius: 6px; }
  .act.past { opacity: .6; }
  #actEmpty { color: var(--muted); text-align: center; padding: 18px 8px; }
  #actbar button:disabled { opacity: .45; cursor: default; }
  #actLoop { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); cursor: pointer; }
  #actLoop input { accent-color: var(--accent); margin: 0; cursor: pointer; }
  #actLoop:has(input:checked) { color: var(--accent); }

  /* ---- Свёрнутая панель: от Parts/JSON/BOM остаются только кнопки
     Generate / Start New; на десктопе колонка сужается под них ---- */
  body.panelCollapsed { grid-template-columns: 1fr 230px; }
  body.panelCollapsed #sidebar > :not(#genRow) { display: none; }
  body.panelCollapsed #genRow { margin-bottom: 10px; }
  /* Подсказка после «Start New Project»: стрелка вверх, на кнопки добавления */
  #startHint {
    position: absolute; top: 14px; left: 132px; z-index: 3;
    max-width: 270px;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 8px;
    padding: 8px 11px; font-size: 12.5px; line-height: 1.4;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
    cursor: pointer; animation: hintIn .25s ease-out;
  }
  #startHint::before {
    content: ''; position: absolute; top: -7px; left: 20px;
    width: 12px; height: 12px; background: var(--panel2);
    border-left: 1px solid var(--accent); border-top: 1px solid var(--accent);
    transform: rotate(45deg);
  }
  #startHint:hover { border-color: var(--text); }
  /* вариант-предупреждение: битый код в ссылке */
  #startHint.warn { border-color: var(--danger); }
  #startHint.warn::before { border-left-color: var(--danger); border-top-color: var(--danger); }
  /* ---- Подсказка шага обучения — стиль как у #startHint ---- */
  #tutHint {
    position: absolute; top: 58px; left: 12px; z-index: 3; /* ниже ряда кнопок #vpTools */
    max-width: 320px;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 8px;
    padding: 8px 11px; font-size: 12.5px; line-height: 1.45;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
    animation: hintIn .25s ease-out;
  }
  #tutHint::before {
    content: ''; position: absolute; top: -7px; left: 20px;
    width: 12px; height: 12px; background: var(--panel2);
    border-left: 1px solid var(--accent); border-top: 1px solid var(--accent);
    transform: rotate(45deg);
  }
  #tutHint .tut-step { color: var(--accent); font-weight: 700; }
  #tutHint .tut-exit {
    float: right; margin-left: 8px; cursor: pointer;
    color: var(--muted); font-weight: 700;
  }
  #tutHint .tut-exit:hover { color: var(--danger); }
  /* подсвеченная кнопка-цель текущего шага */
  #addRow button.tut-target {
    /* !important: перебиваем инлайновый цвет рамки, заданный кнопке по типу */
    border-color: var(--accent) !important;
    animation: tutPulse 1.2s ease-in-out infinite;
  }
  @keyframes tutPulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--accent-soft); }
    50% { box-shadow: 0 0 0 7px var(--accent-soft); }
  }
  /* ---- Модальный диалог обучения ---- */
  #tutModal {
    position: fixed; inset: 0; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .45);
  }
  #tutModal[hidden] { display: none; }
  .tut-box {
    max-width: 460px; margin: 16px;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px 20px;
    box-shadow: 0 16px 48px rgba(0, 0, 0, .4);
  }
  .tut-box h3 { font-size: 16px; margin-bottom: 8px; }
  .tut-box p { font-size: 13.5px; line-height: 1.5; white-space: pre-line; }
  .tut-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .tut-actions button {
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--panel2); color: var(--text);
    padding: 9px 12px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    text-align: left;
  }
  .tut-actions button:hover { border-color: var(--accent); }
  .tut-actions button.primary {
    background: linear-gradient(135deg, #2b6cb0, #4da3ff);
    border: none; color: #fff;
  }
  .tut-actions button.primary:hover { filter: brightness(1.15); }
  @keyframes hintIn { from { opacity: 0; transform: translateY(-8px); } }
  #animToggle input { accent-color: var(--accent); width: 17px; height: 17px; cursor: pointer; }

  /* ---- Правая панель ---- */
  #sidebar {
    grid-area: sidebar;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  /* ---- Шапка: заголовок, версия, тема и язык — во всю ширину, над всем ---- */
  #topbar {
    grid-area: header;
    background: var(--panel);
    font-size: 14px; font-weight: 600;
    padding: 10px 10px 10px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  #titleWrap {
    flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px;
  }
  #appTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #version {
    flex: none; font-size: 10px; font-weight: 600; color: var(--muted);
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 4px; letter-spacing: .02em;
  }
  /* ---- Переключатели темы и языка ---- */
  #themeSw, #langSw {
    flex: none; display: flex; border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden;
  }
  #themeSw button, #langSw button {
    background: var(--panel2); color: var(--muted); border: none;
    padding: 4px 6px; font-size: 10.5px; font-weight: 700; cursor: pointer;
    letter-spacing: .04em; display: inline-flex; align-items: center;
  }
  #themeSw button:hover, #langSw button:hover { color: var(--text); }
  #themeSw button.active, #langSw button.active { background: var(--accent); color: #10141a; }
  #addRow {
    grid-area: toolbar;
    background: var(--panel);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  #addRow button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .ico { flex: none; display: inline-block; vertical-align: -3px; }
  #addRow button:hover { filter: brightness(1.25); }
  #genRow {
    display: flex; flex-direction: column; gap: 8px; margin: 10px 14px 0;
  }
  #genRow button {
    border: none; border-radius: 8px; padding: 8px 12px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #genRow button:hover { filter: brightness(1.15); }
  #btnGenerate { background: linear-gradient(135deg, #2b6cb0, #4da3ff); color: #fff; }
  #btnNew { background: linear-gradient(135deg, #2f8f57, #57d98a); color: #10141a; }
  /* ---- Вкладки: Состав | JSON | BOM ---- */
  #tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    margin-top: 10px;
  }
  #tabs button {
    flex: 1; background: none; color: var(--muted);
    border: none; border-bottom: 2px solid transparent;
    padding: 7px 4px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  #tabs button:hover { color: var(--text); }
  #tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabpane { display: none; }
  .tabpane.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  #components {
    overflow-y: auto; padding: 10px 12px;
    gap: 8px;
  }
  .comp {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .comp-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  }
  .comp-head .num {
    width: 24px; height: 24px; border-radius: 7px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: #10141a;
  }
  .comp-head .name { font-weight: 600; flex: 1; }
  #orderNote { color: var(--muted); font-size: 11px; padding: 0 2px 2px; }
  .comp-head .del {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 4px;
  }
  .comp-head .zone-toggle { accent-color: var(--accent); cursor: pointer; width: 15px; height: 15px; }
  .comp-head .zone-lbl {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .comp-head .del:hover { color: var(--danger); background: rgba(255,92,92,.12); }
  .ctrl { display: grid; grid-template-columns: 1fr 52px; gap: 8px; align-items: center; margin-top: 4px; }
  .ctrl label { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .ctrl input[type=range] { width: 100%; accent-color: var(--accent); }
  .ctrl .val { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--accent); }
  .ctrl.locked { opacity: .55; } /* габарит зафиксирован: дальше уже есть компоненты */
  #empty { color: var(--muted); text-align: center; padding: 24px 10px; font-size: 13px; }

  /* ---- BOM: таблица закупки ---- */
  #bom {
    overflow-y: auto;
    padding: 8px 12px 12px;
  }
  #bom h2 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  #armName {
    font-size: 13.5px; font-weight: 700; color: var(--accent);
    background: var(--panel2); border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 10px; margin: 4px 0 6px;
  }
  #bom .note { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  #bomTable { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  #bomTable th {
    text-align: left; color: var(--muted); font-weight: 500;
    padding: 3px 4px; border-bottom: 1px solid var(--border);
  }
  #bomTable td { padding: 3px 4px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  #bomTable th.num, #bomTable td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #bomTable tr.group td {
    padding-top: 9px; font-weight: 700; font-size: 12px; color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  #bomTable tr.group td.num { color: var(--muted); font-weight: 600; }
  #bomTable tr.group .mult { color: var(--accent); }
  #bomTable select {
    width: 100%; max-width: 100%;
    background: transparent; color: var(--text);
    border: 1px solid transparent; border-radius: 4px;
    font: inherit; padding: 0 2px; margin: -1px 0 -1px -3px; cursor: pointer;
  }
  #bomTable select:hover, #bomTable select:focus {
    border-color: var(--border); background: var(--panel2); outline: none;
  }
  #bomTable select.swapped { color: var(--accent); font-weight: 600; }
  #bomTable tr.total td {
    border-bottom: none; border-top: 2px solid var(--border);
    font-weight: 700; color: var(--accent); font-size: 12.5px; padding-top: 5px;
  }

  /* ---- Лицензия — прижата к низу правой панели ---- */
  #licenseBar {
    flex: none; margin-top: auto;
    padding: 6px 12px; border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted); text-align: center;
  }
  #licenseBar a { color: var(--muted); text-decoration: none; }
  #licenseBar a:hover { color: var(--accent); text-decoration: underline; }

  /* ---- JSON и URDF под 3D-окном ---- */
  #jsonarea, #urdfarea { background: var(--panel); }
  #jsonbar, #urdfbar, #actbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-bottom: 1px solid var(--border);
  }
  #jsonbar .title, #urdfbar .title, #actbar .title { font-weight: 600; font-size: 13px; flex: 1; }
  #jsonbar button, #urdfbar button, #actbar button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 12px; cursor: pointer; font-size: 13px;
  }
  #jsonbar button:hover, #urdfbar button:hover, #actbar button:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
  #jsonbar, #urdfbar, #actbar { flex-wrap: wrap; }
  #jsonStatus, #urdfStatus { font-size: 12px; color: var(--muted); min-width: 0; text-align: right; }
  #jsonStatus.ok, #urdfStatus.ok { color: var(--ok); }
  #jsonStatus.err, #urdfStatus.err { color: var(--danger); }
  #jsonText, #urdfText {
    flex: 1; resize: none; border: none; outline: none;
    background: var(--bg); color: var(--code);
    font: 12px/1.5 Consolas, "Courier New", monospace;
    padding: 10px 12px; white-space: pre; overflow: auto;
  }

  /* ---- Мобильный режим: тулбар компонентов сверху, 3D — главный, панель снизу ---- */
  @media (max-width: 720px) {
    body {
      grid-template-columns: minmax(0, 1fr); /* min-content контента не должен распирать колонку */
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      grid-template-areas:
        "header"
        "toolbar"
        "viewport"
        "sidebar";
      height: 100vh;
      height: 100dvh; /* мобильные браузеры: без скрытия за адресной строкой */
    }
    #addRow {
      flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
      padding: 8px 10px; gap: 6px; -webkit-overflow-scrolling: touch;
    }
    #addRow button { flex: none; padding: 7px 10px; font-size: 12.5px; }
    #sidebar {
      border-left: none; border-top: 1px solid var(--border);
      max-height: 45dvh; min-height: 0;
    }
    #genRow { flex-direction: row; margin: 8px 10px 0; }
    #genRow button {
      flex: 1; min-width: 0; padding: 7px 8px; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #topbar { flex-wrap: wrap; row-gap: 6px; }
    #hint { display: none; }
    #animToggle, #btnShare { padding: 6px 10px; font-size: 12.5px; }
    #startHint { left: 12px; right: 12px; max-width: none; }
    #tutHint { top: 96px; left: 12px; right: 12px; max-width: none; } /* под двумя рядами кнопок */
    #chalPanel { right: 12px; width: auto; max-height: 45%; font-size: 12px; }
    /* свёрнутая панель на мобильном: колонка одна, снизу только кнопки */
    body.panelCollapsed { grid-template-columns: minmax(0, 1fr); }
    body.panelCollapsed #genRow { margin-bottom: 8px; }
    #jsonText, #urdfText { min-height: 120px; }
  }

  /* ---- Развёрнутый 3D-вид: видны только шапка и вьюпорт ---- */
  body.expanded {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas:
      "header"
      "viewport";
  }
  body.expanded #addRow, body.expanded #sidebar { display: none; }
</style>

/* Параметр ссылки: ?k=v в query или #k=v во фрагменте (как и код руки).
   Язык и тема из ссылки применяются только к этой загрузке — сохранённый
   выбор получателя не перезаписывают, пока он сам не переключит. */
function urlParam(k) {
  const qs = new URLSearchParams(location.search);
  const hs = new URLSearchParams(location.hash.replace(/^#\??/, ''));
  return qs.get(k) ?? hs.get(k);
}

const urlLang = (urlParam('lang') || '').toLowerCase().slice(0, 2);

  : LANGS.includes(storedLang()) ? storedLang()
  : (navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';

/* t('key', ...args) — строка интерфейса; tr({en,ru}) — двуязычное поле данных */
function t(key, ...args) {
  const v = STR[key]?.[lang];
  return typeof v === 'function' ? v(...args) : (v ?? key);
}
function tr(o) { return (o && o[lang]) ?? ''; }

/* ---- Зоны вращения/движения (dashed motion zones) ---- */

function dashMat(color) {
  return new THREE.LineDashedMaterial({ color, dashSize: 0.06, gapSize: 0.05, transparent: true, opacity: SCN.zoneLine });
}

/* Полупрозрачный сектор с пунктирной границей в плоскости XY:
   углы в градусах от локальной оси +X против часовой */
function makeSector(color, radius, startDeg, lengthDeg) {
  const g = new THREE.Group();
  const seg = Math.max(12, Math.round(lengthDeg / 5));
  const circ = new THREE.CircleGeometry(radius, seg,
    THREE.MathUtils.degToRad(startDeg), THREE.MathUtils.degToRad(lengthDeg));
  const fill = new THREE.Mesh(circ, new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: SCN.zoneFill, side: THREE.DoubleSide, depthWrite: false,
  }));
  g.add(fill);
  const pts = [];
  const full = lengthDeg >= 359.9;
  if (!full) pts.push(new THREE.Vector3(0, 0, 0));
  for (let i = 0; i <= seg; i++) {
    const a = THREE.MathUtils.degToRad(startDeg + lengthDeg * i / seg);
    pts.push(new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
  }
  if (!full) pts.push(new THREE.Vector3(0, 0, 0));
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), dashMat(color));
  line.computeLineDistances();
  g.add(line);
  return g;
}

/* цвет зоны: цвет типа, приведённый к фону текущей темы */
const _zoneCol = new THREE.Color(), _hsl = {};
function zoneColor(hex) {
  if (SCN.zoneShade === 1 && SCN.zoneSat === 1) return hex;
  _zoneCol.setHex(hex).getHSL(_hsl);
  return _zoneCol.setHSL(_hsl.h, Math.min(1, _hsl.s * SCN.zoneSat), _hsl.l * SCN.zoneShade).getHex();
}

function makeDashedLine(color, points) {
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), dashMat(color));
  line.computeLineDistances();
  return line;
}

/* Создаёт зону для компонента и добавляет её в нужный узел.
   holder — узел, который НЕ вращается вместе с суставом (зона показывает диапазон). */
function makeZone(c, holder, attachY) {
  const t = TYPES[c.type];
  const p = t.params[0];
  const col = zoneColor(t.color); // цвет типа, подогнанный под фон темы
  const zone = new THREE.Group();

  if (c.type === 'yaw' || c.type === 'roll') {
    /* горизонтальный диск в плоскости вращения (вокруг вертикальной оси) */
    const r = c.type === 'yaw' ? 0.72 : 0.5;
    const sector = makeSector(col, r, p.min - 90, p.max - p.min);
    sector.rotation.x = -Math.PI / 2;
    zone.add(sector);
    zone.position.y = attachY + (t.height ?? 0) / 2;
  } else if (c.type === 'pitch') {
    /* вертикальный сектор в плоскости качания (перпендикулярно оси сустава) */
    const sector = makeSector(col, 0.8, 90 - p.max, p.max - p.min);
    sector.rotation.y = -Math.PI / 2;
    zone.add(sector);
    zone.position.y = attachY + t.height / 2;
  } else if (c.type === 'link') {
    /* пунктир диапазона длины звена вдоль оси */
    zone.add(makeDashedLine(col, [
      new THREE.Vector3(0, p.min, 0), new THREE.Vector3(0, p.max, 0),
    ]));
    zone.add(makeDashedLine(col, [
      new THREE.Vector3(-0.12, p.max, 0), new THREE.Vector3(0.12, p.max, 0),
    ]));
    zone.position.y = attachY;
  } else if (c.type === 'gripper') {
    /* пунктир хода пальцев схвата */
    const y = GEOM.gripper.fingerY, xMax = GEOM.gripper.gap0 + GEOM.gripper.gapRange + 0.06;
    zone.add(makeDashedLine(col, [
      new THREE.Vector3(-xMax, y, 0), new THREE.Vector3(xMax, y, 0),
    ]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(-xMax, y - 0.12, 0), new THREE.Vector3(-xMax, y + 0.12, 0)]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(xMax, y - 0.12, 0), new THREE.Vector3(xMax, y + 0.12, 0)]));
    zone.position.y = attachY;
  } else if (c.type === 'prismatic') {
    /* пунктир хода конца штока: от длины корпуса до удвоенной */
    const x = 0.3, L = c.length ?? 0.7;
    zone.add(makeDashedLine(col, [new THREE.Vector3(x, L, 0), new THREE.Vector3(x, 2 * L, 0)]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(x - 0.1, L, 0), new THREE.Vector3(x + 0.1, L, 0)]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(x - 0.1, 2 * L, 0), new THREE.Vector3(x + 0.1, 2 * L, 0)]));
  } else if (c.type === 'spherical') {
    /* два диапазона: диск yaw + вертикальный сектор pitch */
    const pPitch = t.params[0], pYaw = t.params[1];
    const disc = makeSector(col, 0.5, pYaw.min - 90, pYaw.max - pYaw.min);
    disc.rotation.x = -Math.PI / 2;
    const sector = makeSector(col, 0.62, 90 - pPitch.max, pPitch.max - pPitch.min);
    sector.rotation.y = -Math.PI / 2;
    zone.add(disc, sector);
    zone.position.y = 0.32;
  } else if (c.type === 'rail') {
    /* пунктир хода каретки по рельсу */
    const y = 0.34;
    zone.add(makeDashedLine(col, [
      new THREE.Vector3(p.min, y, 0), new THREE.Vector3(p.max, y, 0),
    ]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(p.min, y - 0.12, 0), new THREE.Vector3(p.min, y + 0.12, 0)]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(p.max, y - 0.12, 0), new THREE.Vector3(p.max, y + 0.12, 0)]));
  }

  zone.userData.zone = true; // не деталь руки: не участвует в столкновениях с полом
  zone.visible = c.showZone !== false;
  c._zone = zone;
  holder.add(zone);
}

function buildArm() {
  armRoot.clear();
  pivots = [];
  capsFrame = null; // капсулы столкновений пересчитать

  /* Неподвижное основание */
  const base = new THREE.Group();
  base.add(shadowed(new THREE.Mesh(new THREE.CylinderGeometry(...GEOM.base.r, GEOM.base.h, 32), mat(SCN.base))));
  base.children[0].position.y = GEOM.base.h / 2;
  armRoot.add(base);

  let parent = base;        // группа, к которой крепим следующий компонент
  let attachY = GEOM.base.h; // высота точки крепления в системе parent

  for (const c of components) {
    const t = TYPES[c.type];
    const pivot = new THREE.Group();
    pivot.position.y = attachY;
    parent.add(pivot);
    pivots.push(pivot);

    if (c.type === 'yaw') {
      const G = GEOM.yaw;
      const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(...G.body, t.height, 28), mat(t.color)));
      body.position.y = t.height / 2;
      pivot.add(body);
      const mark = new THREE.Mesh(new THREE.BoxGeometry(G.mark.w, t.height * G.mark.hFrac, G.mark.d), mat(SCN.mark));
      mark.position.set(0, t.height / 2, G.mark.z);
      pivot.add(mark);
      pivot.rotation.y = THREE.MathUtils.degToRad(c.angle ?? 0);
      makeZone(c, parent, attachY);
      parent = pivot;
      attachY = t.height;

    } else if (c.type === 'pitch') {
      /* корпус-ось лежит горизонтально; вращение вокруг X */
      const G = GEOM.pitch;
      const axle = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(G.axle.r, G.axle.r, G.axle.len, 24), mat(t.color)));
      axle.rotation.z = Math.PI / 2;
      axle.position.y = t.height / 2;
      const cap1 = new THREE.Mesh(new THREE.CylinderGeometry(G.cap.r, G.cap.r, G.cap.w, 24), mat(SCN.joint));
      cap1.rotation.z = Math.PI / 2; cap1.position.set(G.cap.x, t.height / 2, 0);
      const cap2 = cap1.clone(); cap2.position.x = -G.cap.x;
      /* внутренняя группа вращается вокруг оси */
      const rot = new THREE.Group();
      rot.position.y = t.height / 2;
      pivot.add(axle, cap1, cap2, rot);
      rot.rotation.x = THREE.MathUtils.degToRad(c.angle ?? 0);
      c._rot = rot;
      makeZone(c, pivot, 0);
      parent = rot;
      attachY = t.height / 2;

    } else if (c.type === 'roll') {
      const G = GEOM.roll;
      const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(...G.body, t.height, 24), mat(t.color)));
      body.position.y = t.height / 2;
      pivot.add(body);
      const mark = new THREE.Mesh(new THREE.BoxGeometry(G.mark.w, t.height * G.mark.hFrac, G.mark.d), mat(SCN.mark));
      mark.position.set(0, t.height / 2, G.mark.z);
      pivot.add(mark);
      pivot.rotation.y = THREE.MathUtils.degToRad(c.angle ?? 0);
      makeZone(c, parent, attachY);
      parent = pivot;
      attachY = t.height;

    } else if (c.type === 'link') {
      const len = c.length ?? 1;
      const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(...GEOM.link.r, 1, 20), mat(t.color)));
      body.position.y = 0.5;
      const linkScale = new THREE.Group();
      linkScale.add(body);
      linkScale.scale.y = len;
      pivot.add(linkScale);
      c._scale = linkScale;
      makeZone(c, pivot, 0);
      parent = pivot;
      attachY = len;

    } else if (c.type === 'gripper') {
      const G = GEOM.gripper;
      const palm = shadowed(new THREE.Mesh(new THREE.BoxGeometry(...G.palm), mat(SCN.joint)));
      palm.position.y = G.palm[1] / 2;
      pivot.add(palm);
      const fGeo = new THREE.BoxGeometry(...G.finger);
      const f1 = shadowed(new THREE.Mesh(fGeo, mat(t.color)));
      const f2 = shadowed(new THREE.Mesh(fGeo, mat(t.color)));
      f1.position.y = f2.position.y = G.fingerY;
      pivot.add(f1, f2);
      c._fingers = [f1, f2];
      applyGripper(c);
      makeZone(c, pivot, 0);
      parent = pivot;
      attachY = t.height;

    } else if (c.type === 'prismatic') {
      /* телескопический линейный привод: шток выдвигается вдоль оси */
      const L = c.length ?? 0.7;
      const outer = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(...GEOM.prismatic.body, L, 20), mat(t.color)));
      outer.position.y = L / 2;
      pivot.add(outer);
      /* шток той же длины: втянутый прячется в корпусе, выдвигается не дальше него */
      const rod = new THREE.Group();
      const rodMesh = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(GEOM.prismatic.rod, GEOM.prismatic.rod, L, 16), mat(SCN.metal)));
      rodMesh.position.y = L / 2;
      rod.add(rodMesh);
      rod.position.y = Math.min(c.ext ?? 0.4, L);
      pivot.add(rod);
      c._rod = rod;
      makeZone(c, pivot, 0);
      parent = rod;
      attachY = L;

    } else if (c.type === 'spherical') {
      /* шаровой шарнир: два вращения (yaw + pitch) в одном узле */
      const G = GEOM.spherical;
      const socket = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(...G.socket.r, G.socket.h, 24), mat(SCN.joint)));
      socket.position.y = G.socket.h / 2;
      const ball = shadowed(new THREE.Mesh(new THREE.SphereGeometry(G.ball.r, 24, 18), mat(t.color)));
      ball.position.y = G.ball.y;
      pivot.add(socket, ball);
      const g1 = new THREE.Group(); g1.position.y = G.ball.y;
      const g2 = new THREE.Group();
      const stub = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(G.stub.r, G.stub.r, G.stub.len, 14), mat(SCN.metal)));
      stub.position.y = G.stub.len / 2;
      g2.add(stub);
      g1.add(g2);
      pivot.add(g1);
      g1.rotation.y = THREE.MathUtils.degToRad(c.yaw ?? 0);
      g2.rotation.x = THREE.MathUtils.degToRad(c.pitch ?? 0);
      c._g1 = g1; c._g2 = g2;
      makeZone(c, pivot, 0);
      parent = g2;
      attachY = G.stub.len;

    } else if (c.type === 'offset') {
      /* Г-образный кронштейн: боковое смещение оси */
      const len = c.length ?? 0.5, G = GEOM.offset;
      const vert = shadowed(new THREE.Mesh(new THREE.BoxGeometry(G.block, G.block, G.block), mat(t.color)));
      vert.position.y = G.block / 2;
      const horiz = shadowed(new THREE.Mesh(new THREE.BoxGeometry(G.arm.w, G.arm.h, len + G.arm.extra), mat(t.color)));
      horiz.position.set(0, G.arm.y, len / 2);
      pivot.add(vert, horiz);
      const end = new THREE.Group();
      end.position.set(0, G.endY, len);
      pivot.add(end);
      parent = end;
      attachY = 0;

    } else if (c.type === 'rail') {
      /* линейный рельс: каретка ездит вдоль X, несёт всё, что выше */
      const G = GEOM.rail;
      const track = shadowed(new THREE.Mesh(new THREE.BoxGeometry(...G.track), mat(SCN.joint)));
      track.position.y = G.track[1] / 2;
      pivot.add(track);
      const car = new THREE.Group();
      const carBody = shadowed(new THREE.Mesh(new THREE.BoxGeometry(...G.car), mat(t.color)));
      carBody.position.y = G.carY;
      car.add(carBody);
      car.position.x = c.pos ?? 0;
      pivot.add(car);
      c._car = car;
      makeZone(c, pivot, 0);
      parent = car;
      attachY = G.attach;

    } else if (c.type === 'suction') {
      /* вакуумная присоска: сила присоса сжимает манжету */
      const G = GEOM.suction;
      const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(...G.body.r, G.body.h, 18), mat(SCN.joint)));
      body.position.y = G.body.h / 2;
      pivot.add(body);
      const cup = shadowed(new THREE.Mesh(new THREE.ConeGeometry(G.cup.r, G.cup.h, 22), mat(t.color)));
      cup.rotation.x = Math.PI;
      pivot.add(cup);
      c._cup = cup;
      applySuction(c);
      parent = pivot;
      attachY = G.attach;

    } else if (c.type === 'drill') {
      /* дрель: корпус + вращающееся сверло; скорость крутит группу _spin */
      const G = GEOM.drill;
      const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(...G.body.r, G.body.h, 20), mat(SCN.joint)));
      body.position.y = G.body.h / 2;
      pivot.add(body);
      const spin = new THREE.Group();
      spin.position.y = G.body.h;
      const bit = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(...G.bit.r, G.bit.len, 10), mat(t.color)));
      bit.position.y = G.bit.len / 2;
      const flute = new THREE.Mesh(new THREE.BoxGeometry(...G.flute), mat(SCN.metal));
      flute.position.y = G.fluteY;
      spin.add(bit, flute);
      pivot.add(spin);
      c._spin = spin;
      parent = pivot;
      attachY = G.attach;

    } else if (c.type === 'mill') {
      /* фреза: шток + вращающаяся шестерня с зубьями */
      const G = GEOM.mill, T = G.teeth;
      const stem = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(...G.stem.r, G.stem.h, 14), mat(SCN.joint)));
      stem.position.y = G.stem.h / 2;
      pivot.add(stem);
      const spin = new THREE.Group();
      spin.position.y = G.spinY;
      const disk = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(G.disk.r, G.disk.r, G.disk.h, 24), mat(t.color)));
      spin.add(disk);
      for (let k = 0; k < T.n; k++) {
        const tooth = shadowed(new THREE.Mesh(new THREE.BoxGeometry(T.size, T.size, T.size), mat(t.color)));
        const a = k / T.n * Math.PI * 2;
        tooth.position.set(Math.cos(a) * T.r, 0, Math.sin(a) * T.r);
        tooth.rotation.y = -a;
        spin.add(tooth);
      }
      pivot.add(spin);
      c._spin = spin;
      parent = pivot;
      attachY = G.attach;
    }
  }
  tipNode = parent; tipY = attachY;
  updateJSONView();
  updateURDFView();
  updateBOM();
  invalidate();
  if (components.length) startHint.hidden = true; // рука уже не пуста
}

/* смещение пальца от оси по раскрытию (ширина пальца 0.09) */
function gripGap(c) { return GEOM.gripper.gap0 + (c.open ?? 50) / 100 * GEOM.gripper.gapRange; }

function applyGripper(c) {
  let gap = gripGap(c);
  /* в режиме заданий пальцы упираются в удерживаемый кубик (c._holdSize) */
  if (c._holdSize) gap = Math.max(gap, c._holdSize / 2 + GEOM.gripper.finger[0] / 2);
  c._fingers[0].position.x = gap;
  c._fingers[1].position.x = -gap;
}

function applySuction(c) {
  const squash = 1 - (c.power ?? 0) / 100 * 0.45;
  c._cup.scale.y = squash;
  c._cup.position.y = GEOM.suction.body.h + GEOM.suction.cup.h / 2 * squash;
}

/* Быстрое применение параметра без пересборки сцены;
   возвращает false, если нужна полная пересборка (link/offset) */
function applyParam3D(c, key) {
  /* габариты (build) меняют геометрию цепочки — нужна пересборка */
  if (key && TYPES[c.type].params.find(p => p.key === key)?.build) return false;
  if (c.type === 'yaw' || c.type === 'roll') {
    pivots[components.indexOf(c)].rotation.y = THREE.MathUtils.degToRad(c.angle);
  } else if (c.type === 'pitch') {
    c._rot.rotation.x = THREE.MathUtils.degToRad(c.angle);
  } else if (c.type === 'gripper') {
    applyGripper(c);
  } else if (c.type === 'prismatic') {
    c._rod.position.y = Math.min(c.ext, c.length ?? c.ext);
  } else if (c.type === 'spherical') {
    c._g1.rotation.y = THREE.MathUtils.degToRad(c.yaw ?? 0);
    c._g2.rotation.x = THREE.MathUtils.degToRad(c.pitch ?? 0);
  } else if (c.type === 'rail') {
    c._car.position.x = c.pos;
  } else if (c.type === 'suction') {
    applySuction(c);
  } else if (c.type === 'link' || c.type === 'offset') {
    /* длина меняет положение потомков — проще пересобрать */
    return false;
  }
  invalidate();
  return true;
}

function applyParam(c, key) {
  if (!applyParam3D(c, key)) { buildArm(); return; }
  updateJSONView();
  updateURDFView(); // в URDF от позы зависит только комментарий-шапка
}

/* ================= UI: панель компонентов ================= */

const addRow = document.getElementById('addRow');
const compList = document.getElementById('components');

function renderAddRow() {
  addRow.innerHTML = '';
  for (const [type, ty] of Object.entries(TYPES)) {
    const b = document.createElement('button');
    const hex = '#' + ty.color.toString(16).padStart(6, '0');
    b.innerHTML = `${iconSVG(type, 22)}+ ${tr(ty.label)}`;
    b.style.borderColor = hex + '55';
    b.title = t('addTip', tr(ty.label));
    b.dataset.type = type; // для подсветки шага обучения
    b.onclick = () => {
      /* в обучении принимаем только кнопку текущего шага */
      if (tutStep >= 0 && type !== TUTORIAL[tutStep]) { tutWrongFlash(); return; }
      const c = { type };
      for (const p of ty.params) c[p.key] = p.def;
      pushUndo();
      components.push(c);
      recordAction({ kind: 'add', i: components.length - 1, comp: clone(c) });
      buildArm();
      renderPanel();
      if (tutStep >= 0) advanceTutorial();
    };
    addRow.appendChild(b);
  }
}

function renderPanel() {
  compList.innerHTML = '';
  if (!components.length) {
    compList.innerHTML = `<div id="empty">${t('empty')}<br>${t('emptyHint')}</div>`;
    return;
  }
  const note = document.createElement('div');
  note.id = 'orderNote';
  note.textContent = t('orderNote');
  compList.appendChild(note);
  components.forEach((c, i) => {
    const ty = TYPES[c.type];
    const card = document.createElement('div');
    card.className = 'comp';

    const head = document.createElement('div');
    head.className = 'comp-head';
    head.innerHTML = `<span class="num" style="background:#${ty.color.toString(16).padStart(6,'0')}">${i + 1}</span>
      ${iconSVG(c.type, 24)}<span class="name">${tr(ty.label)}</span>`;
    if (c._zone) {
      const zoneLbl = document.createElement('label');
      zoneLbl.className = 'zone-lbl';
      zoneLbl.title = t('zoneTip');
      const zoneToggle = document.createElement('input');
      zoneToggle.type = 'checkbox';
      zoneToggle.className = 'zone-toggle';
      zoneToggle.checked = c.showZone !== false;
      zoneToggle.onchange = () => {
        c.showZone = zoneToggle.checked;
        if (c._zone) c._zone.visible = zoneToggle.checked;
        invalidate();
      };
      zoneLbl.appendChild(zoneToggle);
      zoneLbl.appendChild(document.createTextNode(t('zone')));
      head.appendChild(zoneLbl);
    }
    const del = document.createElement('button');
    del.className = 'del'; del.textContent = '✕'; del.title = t('remove');
    del.onclick = () => {
      cancelTutorial();
      pushUndo();
      const snap = cleanConfig()[i];
      components.splice(i, 1);
      buildArm();
      renderPanel();
      recordAction({ kind: 'del', i, comp: snap });
    };
    head.appendChild(del);
    card.appendChild(head);

    for (const p of ty.params) {
      const row = document.createElement('div');
      row.className = 'ctrl';
      const label = document.createElement('label');
      label.textContent = tr(p.label);
      const slider = document.createElement('input');
      slider.type = 'range';
      slider.min = p.min; slider.max = paramMax(c, p); slider.step = p.step;
      slider.value = c[p.key] ?? p.def;
      const val = document.createElement('span');
      val.className = 'val';
      val.textContent = slider.value;
      /* габарит настраивается, только пока компонент последний в цепочке */
      if (p.build && i !== components.length - 1) {
        slider.disabled = true;
        row.classList.add('locked');
        row.title = t('lockedTip');
        label.textContent = '🔒 ' + label.textContent;
      }
      slider.oninput = () => {
        /* запись действий: одно перетаскивание слайдера — одна запись (from фиксируется в начале) */
        if (chal && !chal.replay && c._actFrom?.[p.key] === undefined) {
          (c._actFrom = c._actFrom || {})[p.key] = c[p.key] ?? p.def;
        }
        const v = setParamChecked(c, p.key, parseFloat(slider.value));
        if (v !== parseFloat(slider.value)) slider.value = v; // упёрлись в пол
        val.textContent = quantParam(v, p);
        /* зависимые параметры (ext ≤ length): подтянуть диапазон слайдера */
        for (const q of ty.params) {
          if (q.maxOf !== p.key) continue;
          const s = c._sliders?.[q.key];
          if (s) { s.slider.max = paramMax(c, q); s.slider.value = c[q.key]; s.val.textContent = quantParam(c[q.key], q); }
        }
      };
      slider.onchange = () => {
        const from = c._actFrom?.[p.key];
        if (from === undefined) return;
        delete c._actFrom[p.key];
        recordAction({ kind: 'param', i: components.indexOf(c), type: c.type, key: p.key, from, to: c[p.key] });
      };
      c._sliders = c._sliders || {};
      c._sliders[p.key] = { slider, val };
      row.append(label, slider, val);
      card.appendChild(row);
    }
    compList.appendChild(card);
  });
}

/* ================= Авто-кадрирование камеры ================= */

const _box = new THREE.Box3(), _tmpBox = new THREE.Box3(), _sphere = new THREE.Sphere();
const _frustum = new THREE.Frustum(), _projScreen = new THREE.Matrix4();

/* ограничивающая сфера видимой геометрии перечисленных корней */
function boundsSphere(roots) {
  _box.makeEmpty();
  for (const root of roots) {
    root.updateWorldMatrix(true, true);
    root.traverseVisible(o => {
      const g = o.geometry;
      if (!g) return;
      if (o.isInstancedMesh) {
        if (!o.boundingBox) o.computeBoundingBox();
        _tmpBox.copy(o.boundingBox);
      } else {
        if (!g.boundingBox) g.computeBoundingBox();
        _tmpBox.copy(g.boundingBox);
      }
      _box.union(_tmpBox.applyMatrix4(o.matrixWorld));
    });
  }
  return _box.isEmpty() ? null : _box.getBoundingSphere(_sphere);
}

/* ограничивающая сфера видимой части руки */
function armSphere() { return boundsSphere([armRoot]); }

/* плавно отодвигает камеру, если рука вылезает за кадр (только наружу);
   возвращает true, если камера сдвинулась */
function cameraAutoExpand() {
  const s = armSphere();
  if (!s) return false;
  camera.updateMatrixWorld();
  _projScreen.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  _frustum.setFromProjectionMatrix(_projScreen);
  for (const plane of _frustum.planes) {
    if (plane.distanceToPoint(s.center) < s.radius * 0.92) {
      const dir = camera.position.clone().sub(controls.target);
      const dist = dir.length();
      if (dist < 80) {
        camera.position.copy(controls.target).addScaledVector(dir.normalize(), dist * 1.03);
        return true;
      }
      return false;
    }
  }
  return false;
}

/* полный сброс кадра под текущую руку (после генерации) */
function fitCameraToArm() { fitCameraToSphere(armSphere()); }

function fitCameraToSphere(s) {
  if (!s) return;
  invalidate();
  const vHalf = THREE.MathUtils.degToRad(camera.fov) / 2;
  const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const needed = s.radius * 1.15 / Math.sin(Math.min(vHalf, hHalf));
  controls.target.copy(s.center);
  const dir = new THREE.Vector3(1, 0.62, 1.25).normalize();
  camera.position.copy(s.center).addScaledVector(dir, Math.max(needed, 3.5));
}

/* ================= Генератор случайных рук ================= */

function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.round(rand(a, b)); }
function randLen(a, b) { return +rand(a, b).toFixed(2); }

function generateArm() {
  cancelTutorial();
  const c = [];

  /* иногда — рельс в основании */
  if (Math.random() < 0.3) c.push({ type: 'rail', pos: randLen(-1.5, 1.5) });

  /* база: чаще турель-yaw, иногда шаровой шарнир */
  if (Math.random() < 0.8) c.push({ type: 'yaw', angle: randi(-90, 90) });
  else c.push({ type: 'spherical', pitch: randi(-30, 30), yaw: randi(-60, 60) });

  /* 2–4 секции руки в разных вариациях */
  const sections = randi(2, 4);
  for (let i = 0; i < sections; i++) {
    const r = Math.random();
    if (r < 0.5) {
      c.push({ type: 'pitch', angle: randi(-70, 70) });
      c.push({ type: 'link', length: randLen(0.6, 1.6) });
    } else if (r < 0.65) {
      const L = randLen(0.5, 1.2);
      c.push({ type: 'prismatic', length: L, ext: randLen(0, L) });
    } else if (r < 0.78) {
      c.push({ type: 'spherical', pitch: randi(-45, 45), yaw: randi(-90, 90) });
      c.push({ type: 'link', length: randLen(0.5, 1.2) });
    } else if (r < 0.88) {
      c.push({ type: 'offset', length: randLen(0.3, 1.0) });
    } else {
      c.push({ type: 'roll', angle: randi(-90, 90) });
      c.push({ type: 'link', length: randLen(0.5, 1.2) });
    }
  }

  /* запястье */
  if (Math.random() < 0.6) c.push({ type: 'roll', angle: randi(-90, 90) });
  if (Math.random() < 0.5) c.push({ type: 'pitch', angle: randi(-45, 45) });

  /* концевой эффектор — не всегда */
  if (Math.random() < 0.85) {
    const r = Math.random();
    if (r < 0.5) c.push({ type: 'gripper', open: randi(0, 100) });
    else if (r < 0.7) c.push({ type: 'suction', power: randi(0, 100) });
    else if (r < 0.85) c.push({ type: 'drill', speed: randi(20, 100) });
    else c.push({ type: 'mill', speed: randi(20, 100) });
  }

  pushUndo();
  withLog(() => { components = c; buildArm(); renderPanel(); });
  fitCameraToArm(); // сброс камеры — только при генерации новой руки
}

document.getElementById('btnGenerate').onclick = generateArm;

/* название руки в принятой номенклатуре: «N-осевой манипулятор с захватом» */
function armName() {
  if (!components.length) return { ru: 'Пустая конфигурация', en: 'Empty configuration' };

  const AXES = { yaw: 1, pitch: 1, roll: 1, prismatic: 1, spherical: 2 };
  /* наконечник → его название в имени руки (творительный падеж / with …) */
  const EFFECTORS = {
    gripper: { ru: 'захватом', en: 'gripper' },
    suction: { ru: 'вакуумной присоской', en: 'suction cup' },
    drill:   { ru: 'сверлом', en: 'drill' },
    mill:    { ru: 'фрезой', en: 'milling cutter' },
  };
  let axes = 0, rails = 0;
  const effRu = [], effEn = [];
  for (const c of components) {
    axes += AXES[c.type] ?? 0;
    if (c.type === 'rail') rails++;
    const eff = EFFECTORS[c.type];
    if (eff && !effRu.includes(eff.ru)) { effRu.push(eff.ru); effEn.push(eff.en); }
  }

  let ru, en;
  if (axes === 0) { ru = 'Статическая конструкция'; en = 'Static structure'; }
  else { ru = `${axes}-осевой манипулятор`; en = `${axes}-axis manipulator`; }

  if (rails) { ru += ' на линейном рельсе'; en += ' on linear rail'; }

  if (effRu.length) {
    /* «со сверлом», но «с захватом» */
    ru += (effRu[0][0] === 'с' ? ' со ' : ' с ') + effRu.join(' и ');
    en += ' with ' + effEn.join(' and ');
  } else if (axes > 0) { ru += ' без концевого эффектора'; en += ' without end effector'; }

  return { ru, en };
}

function fmt$(v) { return '$' + (Math.round(v * 100) / 100).toLocaleString('en-US'); }

   Порядок групп — как в руке, от основания к концу. */
function bomGroups() {
  const byType = new Map();
  for (const c of components) {
    const needs = NEEDS[c.type];
    if (!needs) continue;
    let g = byType.get(c.type);
    if (!g) byType.set(c.type, g = { label: tr(TYPES[c.type].label), count: 0, parts: {} });
    g.count++;
    for (const [key, n] of Object.entries(needs)) g.parts[key] = (g.parts[key] || 0) + n;
  }
  const groups = [...byType.values()];
  if (components.length) {
    /* базовая электроника — один комплект на руку, по конденсатору на драйвер */
    const drivers = groups.reduce((s, g) => s + (g.parts.tmc2209 || 0), 0);
    const parts = { esp32: 1, buck: 1, psu: 1, hw: 1 };
    if (drivers) parts.cap = drivers;
    groups.push({ label: t('bomBase'), count: 1, parts });
  }
  return groups;
}
