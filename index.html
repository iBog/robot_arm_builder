<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robo-Arm Builder</title>
<style>
  /* Светлая тема — по умолчанию; светло-серые тона 3D-редакторов (3ds Max) */
  :root {
    color-scheme: light; /* нативные списки и скроллбары в тон теме */
    --bg: #e9eaec;
    --panel: #f3f4f6;
    --panel2: #e2e4e8;
    --border: #c2c6cc;
    --border-soft: rgba(120, 128, 138, .32);
    --text: #22262c;
    --muted: #666d77;
    --accent: #1f6fd0;
    --accent-soft: rgba(31, 111, 208, .14);
    --danger: #cf3a35;
    --ok: #1f8a52;
    --code: #2f6d2e;
    --overlay: rgba(243, 244, 246, .88);
  }
  /* Тёмная тема */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14171c;
    --panel: #1d222a;
    --panel2: #232a34;
    --border: #313a47;
    --border-soft: rgba(49, 58, 71, .45);
    --text: #e6ebf2;
    --muted: #8b97a8;
    --accent: #4da3ff;
    --accent-soft: rgba(77, 163, 255, .18);
    --danger: #ff5c5c;
    --ok: #57d98a;
    --code: #b9e3a6;
    --overlay: rgba(29, 34, 42, .82);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: auto 1fr;
    grid-template-areas:
      "toolbar  sidebar"
      "viewport sidebar";
    height: 100vh;
    overflow: hidden;
  }
  #viewport { grid-area: viewport; position: relative; min-width: 0; min-height: 0; }
  #viewport canvas { display: block; }
  #hint {
    position: absolute; left: 12px; bottom: 10px;
    color: var(--muted); font-size: 12px; pointer-events: none;
  }
  /* Инструменты 3D-окна: переключатель анимации + ссылка — левый верхний угол */
  #vpTools {
    position: absolute; left: 12px; top: 10px; z-index: 2;
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  #animToggle, #btnShare {
    display: flex; align-items: center; gap: 8px;
    background: var(--overlay); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 13px;
    font: 600 13.5px/1.45 "Segoe UI", system-ui, sans-serif;
    color: var(--text); cursor: pointer;
    box-shadow: 0 3px 12px rgba(0, 0, 0, .22);
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  #animToggle:hover, #btnShare:hover { border-color: var(--accent); }
  #animToggle.on { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  #btnShare.done { border-color: var(--ok); color: var(--ok); }
  /* Подсказка после «Start New Project»: стрелка вверх, на кнопки добавления */
  #startHint {
    position: absolute; top: 14px; left: 132px; z-index: 3;
    max-width: 270px;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--accent); border-radius: 8px;
    padding: 8px 11px; font-size: 12.5px; line-height: 1.4;
    box-shadow: 0 8px 20px rgba(0, 0, 0, .35);
    cursor: pointer; animation: hintIn .25s ease-out;
  }
  #startHint::before {
    content: ''; position: absolute; top: -7px; left: 20px;
    width: 12px; height: 12px; background: var(--panel2);
    border-left: 1px solid var(--accent); border-top: 1px solid var(--accent);
    transform: rotate(45deg);
  }
  #startHint:hover { border-color: var(--text); }
  @keyframes hintIn { from { opacity: 0; transform: translateY(-8px); } }
  #animToggle input { accent-color: var(--accent); width: 17px; height: 17px; cursor: pointer; }

  /* ---- Правая панель ---- */
  #sidebar {
    grid-area: sidebar;
    background: var(--panel);
    border-left: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  #sidebar h1 {
    font-size: 14px; font-weight: 600;
    padding: 10px 10px 10px 12px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 6px;
  }
  #titleWrap {
    flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 6px;
  }
  #appTitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #version {
    flex: none; font-size: 10px; font-weight: 600; color: var(--muted);
    background: var(--panel2); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 4px; letter-spacing: .02em;
  }
  /* ---- Переключатели темы и языка ---- */
  #themeSw, #langSw {
    flex: none; display: flex; border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden;
  }
  #themeSw button, #langSw button {
    background: var(--panel2); color: var(--muted); border: none;
    padding: 4px 6px; font-size: 10.5px; font-weight: 700; cursor: pointer;
    letter-spacing: .04em; display: inline-flex; align-items: center;
  }
  #themeSw button:hover, #langSw button:hover { color: var(--text); }
  #themeSw button.active, #langSw button.active { background: var(--accent); color: #10141a; }
  #addRow {
    grid-area: toolbar;
    background: var(--panel);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  }
  #addRow button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; cursor: pointer; font-size: 13.5px;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .ico { flex: none; display: inline-block; vertical-align: -3px; }
  #addRow button:hover { filter: brightness(1.25); }
  #genRow {
    display: flex; flex-direction: column; gap: 8px; margin: 10px 14px 0;
  }
  #genRow button {
    border: none; border-radius: 8px; padding: 8px 12px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #genRow button:hover { filter: brightness(1.15); }
  #btnGenerate { background: linear-gradient(135deg, #2b6cb0, #4da3ff); color: #fff; }
  #btnNew { background: linear-gradient(135deg, #2f8f57, #57d98a); color: #10141a; }
  /* ---- Вкладки: Состав | JSON | BOM ---- */
  #tabs {
    display: flex; gap: 0;
    border-bottom: 1px solid var(--border);
    margin-top: 10px;
  }
  #tabs button {
    flex: 1; background: none; color: var(--muted);
    border: none; border-bottom: 2px solid transparent;
    padding: 7px 4px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  #tabs button:hover { color: var(--text); }
  #tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tabpane { display: none; }
  .tabpane.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  #components {
    overflow-y: auto; padding: 10px 12px;
    gap: 8px;
  }
  .comp {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  .comp-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
  }
  .comp-head .num {
    width: 24px; height: 24px; border-radius: 7px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; color: #10141a;
  }
  .comp-head .name { font-weight: 600; flex: 1; }
  #orderNote { color: var(--muted); font-size: 11px; padding: 0 2px 2px; }
  .comp-head .del {
    background: none; border: none; color: var(--muted);
    cursor: pointer; font-size: 15px; padding: 2px 6px; border-radius: 4px;
  }
  .comp-head .zone-toggle { accent-color: var(--accent); cursor: pointer; width: 15px; height: 15px; }
  .comp-head .zone-lbl {
    display: flex; align-items: center; gap: 4px;
    font-size: 11px; color: var(--muted); cursor: pointer; white-space: nowrap;
  }
  .comp-head .del:hover { color: var(--danger); background: rgba(255,92,92,.12); }
  .ctrl { display: grid; grid-template-columns: 1fr 52px; gap: 8px; align-items: center; margin-top: 4px; }
  .ctrl label { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
  .ctrl input[type=range] { width: 100%; accent-color: var(--accent); }
  .ctrl .val { text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--accent); }
  #empty { color: var(--muted); text-align: center; padding: 24px 10px; font-size: 13px; }

  /* ---- BOM: таблица закупки ---- */
  #bom {
    overflow-y: auto;
    padding: 8px 12px 12px;
  }
  #bom h2 { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
  #armName {
    font-size: 13.5px; font-weight: 700; color: var(--accent);
    background: var(--panel2); border: 1px solid var(--border); border-radius: 7px;
    padding: 6px 10px; margin: 4px 0 6px;
  }
  #bom .note { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  #bomTable { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  #bomTable th {
    text-align: left; color: var(--muted); font-weight: 500;
    padding: 3px 4px; border-bottom: 1px solid var(--border);
  }
  #bomTable td { padding: 3px 4px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  #bomTable th.num, #bomTable td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #bomTable tr.group td {
    padding-top: 9px; font-weight: 700; font-size: 12px; color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  #bomTable tr.group td.num { color: var(--muted); font-weight: 600; }
  #bomTable tr.group .mult { color: var(--accent); }
  #bomTable select {
    width: 100%; max-width: 100%;
    background: transparent; color: var(--text);
    border: 1px solid transparent; border-radius: 4px;
    font: inherit; padding: 0 2px; margin: -1px 0 -1px -3px; cursor: pointer;
  }
  #bomTable select:hover, #bomTable select:focus {
    border-color: var(--border); background: var(--panel2); outline: none;
  }
  #bomTable select.swapped { color: var(--accent); font-weight: 600; }
  #bomTable tr.total td {
    border-bottom: none; border-top: 2px solid var(--border);
    font-weight: 700; color: var(--accent); font-size: 12.5px; padding-top: 5px;
  }

  /* ---- JSON под 3D-окном ---- */
  #jsonarea { background: var(--panel); }
  #jsonbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; border-bottom: 1px solid var(--border);
  }
  #jsonbar .title { font-weight: 600; font-size: 13px; flex: 1; }
  #jsonbar button {
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 12px; cursor: pointer; font-size: 13px;
  }
  #jsonbar button:hover { border-color: var(--accent); color: var(--accent); }
  #jsonbar { flex-wrap: wrap; }
  #jsonStatus { font-size: 12px; color: var(--muted); min-width: 0; text-align: right; }
  #jsonStatus.ok { color: var(--ok); }
  #jsonStatus.err { color: var(--danger); }
  #jsonText {
    flex: 1; resize: none; border: none; outline: none;
    background: var(--bg); color: var(--code);
    font: 12px/1.5 Consolas, "Courier New", monospace;
    padding: 10px 12px; white-space: pre; overflow: auto;
  }

  /* ---- Мобильный режим: тулбар компонентов сверху, 3D — главный, панель снизу ---- */
  @media (max-width: 720px) {
    body {
      grid-template-columns: minmax(0, 1fr); /* min-content контента не должен распирать колонку */
      grid-template-rows: auto minmax(0, 1fr) auto;
      grid-template-areas:
        "toolbar"
        "viewport"
        "sidebar";
      height: 100vh;
      height: 100dvh; /* мобильные браузеры: без скрытия за адресной строкой */
    }
    #addRow {
      flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain;
      padding: 8px 10px; gap: 6px; -webkit-overflow-scrolling: touch;
    }
    #addRow button { flex: none; padding: 7px 10px; font-size: 12.5px; }
    #sidebar {
      border-left: none; border-top: 1px solid var(--border);
      max-height: 45dvh; min-height: 0;
    }
    #genRow { flex-direction: row; margin: 8px 10px 0; }
    #genRow button {
      flex: 1; min-width: 0; padding: 7px 8px; font-size: 13px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #sidebar h1 { flex-wrap: wrap; row-gap: 6px; }
    #hint { display: none; }
    #animToggle, #btnShare { padding: 6px 10px; font-size: 12.5px; }
    #startHint { left: 12px; right: 12px; max-width: none; }
    #jsonText { min-height: 120px; }
  }
</style>
</head>
<body>

<div id="addRow"></div>

<div id="viewport">
  <div id="vpTools">
    <label id="animToggle"><input type="checkbox" id="chkAnimate" checked><span id="animLbl">Animate</span></label>
    <button id="btnShare"></button>
  </div>
  <div id="startHint" hidden></div>
  <div id="hint"></div>
</div>

<div id="sidebar">
  <h1>
    <span id="titleWrap">
      <span id="appTitle">🦾 Robo-Arm Builder</span><span id="version"></span>
    </span>
    <span id="themeSw">
      <button data-theme="dark"><svg width="13" height="13" viewBox="0 0 18 18" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
        ><path d="M14.6 11.3A6.3 6.3 0 0 1 6.7 3.4a5.9 5.9 0 1 0 7.9 7.9z"/></svg></button
      ><button data-theme="light"><svg width="13" height="13" viewBox="0 0 18 18" fill="none"
        stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
        ><circle cx="9" cy="9" r="3.1"/><path d="M9 1.6v1.9M9 14.5v1.9M1.6 9h1.9M14.5 9h1.9M3.8
        3.8l1.3 1.3M12.9 12.9l1.3 1.3M14.2 3.8l-1.3 1.3M5.1 12.9l-1.3 1.3"/></svg></button>
    </span>
    <span id="langSw">
      <button data-lang="en">EN</button><button data-lang="ru">RU</button>
    </span>
  </h1>
  <div id="genRow">
    <button id="btnGenerate"></button>
    <button id="btnNew"></button>
  </div>
  <div id="tabs">
    <button data-tab="components" class="active"></button>
    <button data-tab="jsonarea"></button>
    <button data-tab="bom"></button>
  </div>
  <div id="components" class="tabpane active"></div>
  <div id="jsonarea" class="tabpane">
    <div id="jsonbar">
      <span class="title" id="jsonTitle"></span>
      <span id="jsonStatus"></span>
      <button id="btnApply"></button>
      <button id="btnCopy"></button>
    </div>
    <textarea id="jsonText" spellcheck="false"></textarea>
  </div>
  <div id="bom" class="tabpane">
    <h2 id="bomTitle"></h2>
    <div id="armName"></div>
    <div class="note" id="bomNote"></div>
    <table id="bomTable"></table>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* Версия проекта — инкрементируется при каждом заметном изменении */
const VERSION = '1.1.2';

/* Публичный адрес приложения (GitHub Pages репозитория iBog/robot_arm_builder) —
   на него ведёт кнопка «Ссылка», параметр ?config= восстанавливает руку */
const SHARE_BASE = 'https://ibog.github.io/robot_arm_builder/';

/* ================= Локализация: English / Русский ================= */

/* Строки интерфейса. Значение — либо строка, либо функция от аргументов t(). */
const STR = {
  appTitle:   { en: '🦾 Robo-Arm Builder',            ru: '🦾 Конструктор робо-руки' },
  docTitle:   { en: 'Robo-Arm Builder',               ru: 'Конструктор робо-руки' },
  hint:       { en: 'LMB — rotate · wheel — zoom · RMB — pan',
                ru: 'ЛКМ — вращение · колесо — зум · ПКМ — панорама' },
  animate:    { en: 'Animate',                        ru: 'Анимация' },
  themeDark:  { en: 'Dark theme',                     ru: 'Тёмная тема' },
  themeLight: { en: 'Light theme',                    ru: 'Светлая тема' },
  animateTip: { en: 'Auto-animate the joints',        ru: 'Авто-анимация суставов' },
  generate:   { en: '🎲 Generate Arm',                ru: '🎲 Случайная рука' },
  newProject: { en: '✨ Start New Project',           ru: '✨ Новый проект' },
  newTip:     { en: 'Clear the arm and start from scratch',
                ru: 'Очистить руку и начать с нуля' },
  startHint:  { en: '👆 Click a button above to add the first component of your arm',
                ru: '👆 Нажмите кнопку выше, чтобы добавить первый компонент руки' },
  tabParts:   { en: 'Parts',                          ru: 'Состав' },
  tabJson:    { en: 'JSON',                           ru: 'JSON' },
  tabBom:     { en: '🛒 BOM',                         ru: '🛒 Закупка' },
  addTip:     { en: name => `Add: ${name}`,           ru: name => `Добавить: ${name}` },
  empty:      { en: 'Arm is empty.',                  ru: 'Рука пуста.' },
  emptyHint:  { en: 'Add components with the buttons above — they stack up from the base.',
                ru: 'Добавляйте компоненты кнопками выше — они наращиваются от основания.' },
  orderNote:  { en: '⬇ order from the base to the arm tip',
                ru: '⬇ порядок — от основания к концу руки' },
  zone:       { en: 'zone',                           ru: 'зона' },
  zoneTip:    { en: 'Motion zone — show/hide the dashed range',
                ru: 'Зона движения — вкл/выкл пунктирную область' },
  remove:     { en: 'Remove component',               ru: 'Удалить компонент' },
  jsonTitle:  { en: 'JSON configuration',             ru: 'Конфигурация JSON' },
  apply:      { en: 'Apply',                          ru: 'Применить' },
  copy:       { en: 'Copy',                           ru: 'Копировать' },
  applied:    { en: '✓ applied',                      ru: '✓ применено' },
  copied:     { en: '✓ copied',                       ru: '✓ скопировано' },
  share:      { en: '🔗 Share',                       ru: '🔗 Ссылка' },
  shareTip:   { en: 'Copy a link that recreates this arm',
                ru: 'Скопировать ссылку, воссоздающую эту руку' },
  shareCopied:{ en: '✓ link copied',                  ru: '✓ ссылка скопирована' },
  errPrefix:  { en: e => `Error: ${e}`,               ru: e => `Ошибка: ${e}` },
  errArray:   { en: 'an array of components is expected',
                ru: 'ожидается массив компонентов' },
  errType:    { en: (i, ty) => `component #${i}: unknown type "${ty}"`,
                ru: (i, ty) => `компонент #${i}: неизвестный type "${ty}"` },
  bomTitle:   { en: '🛒 BOM — parts to buy',          ru: '🛒 BOM — список закупки' },
  bomNote:    { en: 'Approximate prices, ~USD (AliExpress), grouped by the component they belong to. '
                  + 'Parts with a dropdown have common alternatives — pick one to see how the price changes.',
                ru: 'Ориентировочные цены, ~USD (AliExpress), сгруппированы по компоненту, к которому относятся. '
                  + 'У деталей со списком есть распространённые замены — выберите, чтобы увидеть, как изменится цена.' },
  colName:    { en: 'Component',                      ru: 'Компонент' },
  colQty:     { en: 'Qty',                            ru: 'Кол-во' },
  colPrice:   { en: 'Price',                          ru: 'Цена' },
  colSum:     { en: 'Sum',                            ru: 'Сумма' },
  total:      { en: 'Total',                          ru: 'Итого' },
  bomEmpty:   { en: 'Arm is empty — nothing to buy.', ru: 'Рука пуста — покупать нечего.' },
  bomBase:    { en: 'Base kit & electronics',         ru: 'Базовый комплект и электроника' },
  bomAltTip:  { en: 'Common alternatives for this part',
                ru: 'Распространённые замены для этой детали' },
};

const LANGS = ['en', 'ru'];
const LANG_KEY = 'roboArmLang';

function storedLang() {
  try { return localStorage.getItem(LANG_KEY); } catch { return null; }
}
let lang = LANGS.includes(storedLang()) ? storedLang()
  : (navigator.language || '').toLowerCase().startsWith('ru') ? 'ru' : 'en';

/* t('key', ...args) — строка интерфейса; tr({en,ru}) — двуязычное поле данных */
function t(key, ...args) {
  const v = STR[key]?.[lang];
  return typeof v === 'function' ? v(...args) : (v ?? key);
}
function tr(o) { return (o && o[lang]) ?? ''; }

/* ================= Тема: dark / light ================= */

/* Палитра интерфейса — в CSS (`:root[data-theme]`), здесь — цвета 3D-сцены. */
const SCENE_THEME = {
  dark: {
    bg: 0x14171c, ground: 0x1b2027, grid1: 0x3a4656, grid2: 0x242c37,
    base: 0x3d4654, joint: 0x2c333f, metal: 0xcfd6e0, mark: 0xffffff,
    hemiSky: 0xcfe4ff, hemiGround: 0x2a2620, hemiInt: 0.9, sunInt: 1.6,

/* ---- Зоны вращения/движения (dashed motion zones) ---- */

function dashMat(color) {
  return new THREE.LineDashedMaterial({ color, dashSize: 0.06, gapSize: 0.05, transparent: true, opacity: SCN.zoneLine });
}

/* Полупрозрачный сектор с пунктирной границей в плоскости XY:
   углы в градусах от локальной оси +X против часовой */
function makeSector(color, radius, startDeg, lengthDeg) {
  const g = new THREE.Group();
  const seg = Math.max(12, Math.round(lengthDeg / 5));
  const circ = new THREE.CircleGeometry(radius, seg,
    THREE.MathUtils.degToRad(startDeg), THREE.MathUtils.degToRad(lengthDeg));
  const fill = new THREE.Mesh(circ, new THREE.MeshBasicMaterial({
    color, transparent: true, opacity: SCN.zoneFill, side: THREE.DoubleSide, depthWrite: false,
  }));
  g.add(fill);
  const pts = [];
  const full = lengthDeg >= 359.9;
  if (!full) pts.push(new THREE.Vector3(0, 0, 0));
  for (let i = 0; i <= seg; i++) {
    const a = THREE.MathUtils.degToRad(startDeg + lengthDeg * i / seg);
    pts.push(new THREE.Vector3(Math.cos(a) * radius, Math.sin(a) * radius, 0));
  }
  if (!full) pts.push(new THREE.Vector3(0, 0, 0));
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), dashMat(color));
  line.computeLineDistances();
  g.add(line);
  return g;
}

/* цвет зоны: цвет типа, приведённый к фону текущей темы */
const _zoneCol = new THREE.Color(), _hsl = {};
function zoneColor(hex) {
  if (SCN.zoneShade === 1 && SCN.zoneSat === 1) return hex;
  _zoneCol.setHex(hex).getHSL(_hsl);
  return _zoneCol.setHSL(_hsl.h, Math.min(1, _hsl.s * SCN.zoneSat), _hsl.l * SCN.zoneShade).getHex();
}

function makeDashedLine(color, points) {
  const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), dashMat(color));
  line.computeLineDistances();
  return line;
}

/* Создаёт зону для компонента и добавляет её в нужный узел.
   holder — узел, который НЕ вращается вместе с суставом (зона показывает диапазон). */
function makeZone(c, holder, attachY) {
  const t = TYPES[c.type];
  const p = t.params[0];
  const col = zoneColor(t.color); // цвет типа, подогнанный под фон темы
  const zone = new THREE.Group();

  if (c.type === 'yaw' || c.type === 'roll') {
    /* горизонтальный диск в плоскости вращения (вокруг вертикальной оси) */
    const r = c.type === 'yaw' ? 0.72 : 0.5;
    const sector = makeSector(col, r, p.min - 90, p.max - p.min);
    sector.rotation.x = -Math.PI / 2;
    zone.add(sector);
    zone.position.y = attachY + (t.height ?? 0) / 2;
  } else if (c.type === 'pitch') {
    /* вертикальный сектор в плоскости качания (перпендикулярно оси сустава) */
    const sector = makeSector(col, 0.8, 90 - p.max, p.max - p.min);
    sector.rotation.y = -Math.PI / 2;
    zone.add(sector);
    zone.position.y = attachY + t.height / 2;
  } else if (c.type === 'link') {
    /* пунктир диапазона длины звена вдоль оси */
    zone.add(makeDashedLine(col, [
      new THREE.Vector3(0, p.min, 0), new THREE.Vector3(0, p.max, 0),
    ]));
    zone.add(makeDashedLine(col, [
      new THREE.Vector3(-0.12, p.max, 0), new THREE.Vector3(0.12, p.max, 0),
    ]));
    zone.position.y = attachY;
  } else if (c.type === 'gripper') {
    /* пунктир хода пальцев схвата */
    const y = 0.16 + 0.21, xMax = 0.05 + 0.18 + 0.06;
    zone.add(makeDashedLine(col, [
      new THREE.Vector3(-xMax, y, 0), new THREE.Vector3(xMax, y, 0),
    ]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(-xMax, y - 0.12, 0), new THREE.Vector3(-xMax, y + 0.12, 0)]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(xMax, y - 0.12, 0), new THREE.Vector3(xMax, y + 0.12, 0)]));
    zone.position.y = attachY;
  } else if (c.type === 'prismatic') {
    /* пунктир хода штока телескопа */
    const x = 0.3;
    zone.add(makeDashedLine(col, [
      new THREE.Vector3(x, 0.8 + p.min, 0), new THREE.Vector3(x, 0.8 + p.max, 0),
    ]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(x - 0.1, 0.8 + p.min, 0), new THREE.Vector3(x + 0.1, 0.8 + p.min, 0)]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(x - 0.1, 0.8 + p.max, 0), new THREE.Vector3(x + 0.1, 0.8 + p.max, 0)]));
  } else if (c.type === 'spherical') {
    /* два диапазона: диск yaw + вертикальный сектор pitch */
    const pPitch = t.params[0], pYaw = t.params[1];
    const disc = makeSector(col, 0.5, pYaw.min - 90, pYaw.max - pYaw.min);
    disc.rotation.x = -Math.PI / 2;
    const sector = makeSector(col, 0.62, 90 - pPitch.max, pPitch.max - pPitch.min);
    sector.rotation.y = -Math.PI / 2;
    zone.add(disc, sector);
    zone.position.y = 0.32;
  } else if (c.type === 'rail') {
    /* пунктир хода каретки по рельсу */
    const y = 0.34;
    zone.add(makeDashedLine(col, [
      new THREE.Vector3(p.min, y, 0), new THREE.Vector3(p.max, y, 0),
    ]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(p.min, y - 0.12, 0), new THREE.Vector3(p.min, y + 0.12, 0)]));
    zone.add(makeDashedLine(col, [new THREE.Vector3(p.max, y - 0.12, 0), new THREE.Vector3(p.max, y + 0.12, 0)]));
  }

  zone.visible = c.showZone !== false;
  c._zone = zone;
  holder.add(zone);
}

function buildArm() {
  armRoot.clear();
  pivots = [];

  /* Неподвижное основание */
  const base = new THREE.Group();
  base.add(shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.7, 0.25, 32), mat(SCN.base))));
  base.children[0].position.y = 0.125;
  armRoot.add(base);

  let parent = base;      // группа, к которой крепим следующий компонент
  let attachY = 0.25;     // высота точки крепления в системе parent

  for (const c of components) {
    const t = TYPES[c.type];
    const pivot = new THREE.Group();
    pivot.position.y = attachY;
    parent.add(pivot);
    pivots.push(pivot);

    if (c.type === 'yaw') {
      const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.4, t.height, 28), mat(t.color)));
      body.position.y = t.height / 2;
      pivot.add(body);
      const mark = new THREE.Mesh(new THREE.BoxGeometry(0.06, t.height * 0.7, 0.42), mat(SCN.mark));
      mark.position.set(0, t.height / 2, 0.2);
      pivot.add(mark);
      pivot.rotation.y = THREE.MathUtils.degToRad(c.angle ?? 0);
      makeZone(c, parent, attachY);
      parent = pivot;
      attachY = t.height;

    } else if (c.type === 'pitch') {
      /* корпус-ось лежит горизонтально; вращение вокруг X */
      const axle = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.26, 0.26, 0.62, 24), mat(t.color)));
      axle.rotation.z = Math.PI / 2;
      axle.position.y = t.height / 2;
      const cap1 = new THREE.Mesh(new THREE.CylinderGeometry(0.29, 0.29, 0.07, 24), mat(SCN.joint));
      cap1.rotation.z = Math.PI / 2; cap1.position.set(0.33, t.height / 2, 0);
      const cap2 = cap1.clone(); cap2.position.x = -0.33;
      /* внутренняя группа вращается вокруг оси */
      const rot = new THREE.Group();
      rot.position.y = t.height / 2;
      pivot.add(axle, cap1, cap2, rot);
      rot.rotation.x = THREE.MathUtils.degToRad(c.angle ?? 0);
      c._rot = rot;
      makeZone(c, pivot, 0);
      parent = rot;
      attachY = t.height / 2;

    } else if (c.type === 'roll') {
      const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.28, t.height, 24), mat(t.color)));
      body.position.y = t.height / 2;
      pivot.add(body);
      const mark = new THREE.Mesh(new THREE.BoxGeometry(0.05, t.height * 0.8, 0.3), mat(SCN.mark));
      mark.position.set(0, t.height / 2, 0.16);
      pivot.add(mark);
      pivot.rotation.y = THREE.MathUtils.degToRad(c.angle ?? 0);
      makeZone(c, parent, attachY);
      parent = pivot;
      attachY = t.height;

    } else if (c.type === 'link') {
      const len = c.length ?? 1;
      const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.19, 1, 20), mat(t.color)));
      body.position.y = 0.5;
      const linkScale = new THREE.Group();
      linkScale.add(body);
      linkScale.scale.y = len;
      pivot.add(linkScale);
      c._scale = linkScale;
      makeZone(c, pivot, 0);
      parent = pivot;
      attachY = len;

    } else if (c.type === 'gripper') {
      const palm = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.16, 0.3), mat(SCN.joint)));
      palm.position.y = 0.08;
      pivot.add(palm);
      const fGeo = new THREE.BoxGeometry(0.09, 0.42, 0.16);
      const f1 = shadowed(new THREE.Mesh(fGeo, mat(t.color)));
      const f2 = shadowed(new THREE.Mesh(fGeo, mat(t.color)));
      f1.position.y = f2.position.y = 0.16 + 0.21;
      pivot.add(f1, f2);
      c._fingers = [f1, f2];
      applyGripper(c);
      makeZone(c, pivot, 0);
      parent = pivot;
      attachY = t.height;

    } else if (c.type === 'prismatic') {
      /* телескопический линейный привод: шток выдвигается вдоль оси */
      const outer = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.25, 0.7, 20), mat(t.color)));
      outer.position.y = 0.35;
      pivot.add(outer);
      const rod = new THREE.Group();
      const rodMesh = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.8, 16), mat(SCN.metal)));
      rodMesh.position.y = 0.4;
      rod.add(rodMesh);
      rod.position.y = c.ext ?? 0.4;
      pivot.add(rod);
      c._rod = rod;
      makeZone(c, pivot, 0);
      parent = rod;
      attachY = 0.8;

    } else if (c.type === 'spherical') {
      /* шаровой шарнир: два вращения (yaw + pitch) в одном узле */
      const socket = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.34, 0.2, 24), mat(SCN.joint)));
      socket.position.y = 0.1;
      const ball = shadowed(new THREE.Mesh(new THREE.SphereGeometry(0.26, 24, 18), mat(t.color)));
      ball.position.y = 0.32;
      pivot.add(socket, ball);
      const g1 = new THREE.Group(); g1.position.y = 0.32;
      const g2 = new THREE.Group();
      const stub = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.3, 14), mat(SCN.metal)));
      stub.position.y = 0.15;
      g2.add(stub);
      g1.add(g2);
      pivot.add(g1);
      g1.rotation.y = THREE.MathUtils.degToRad(c.yaw ?? 0);
      g2.rotation.x = THREE.MathUtils.degToRad(c.pitch ?? 0);
      c._g1 = g1; c._g2 = g2;
      makeZone(c, pivot, 0);
      parent = g2;
      attachY = 0.3;

    } else if (c.type === 'offset') {
      /* Г-образный кронштейн: боковое смещение оси */
      const len = c.length ?? 0.5;
      const vert = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.24, 0.24), mat(t.color)));
      vert.position.y = 0.12;
      const horiz = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.16, len + 0.1), mat(t.color)));
      horiz.position.set(0, 0.2, len / 2);
      pivot.add(vert, horiz);
      const end = new THREE.Group();
      end.position.set(0, 0.28, len);
      pivot.add(end);
      parent = end;
      attachY = 0;

    } else if (c.type === 'rail') {
      /* линейный рельс: каретка ездит вдоль X, несёт всё, что выше */
      const track = shadowed(new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.12, 0.5), mat(SCN.joint)));
      track.position.y = 0.06;
      pivot.add(track);
      const car = new THREE.Group();
      const carBody = shadowed(new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.18, 0.58), mat(t.color)));
      carBody.position.y = 0.21;
      car.add(carBody);
      car.position.x = c.pos ?? 0;
      pivot.add(car);
      c._car = car;
      makeZone(c, pivot, 0);
      parent = car;
      attachY = 0.3;

    } else if (c.type === 'suction') {
      /* вакуумная присоска: сила присоса сжимает манжету */
      const body = shadowed(new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.17, 0.16, 18), mat(SCN.joint)));
      body.position.y = 0.08;
      pivot.add(body);
      const cup = shadowed(new THREE.Mesh(new THREE.ConeGeometry(0.24, 0.2, 22), mat(t.color)));
      cup.rotation.x = Math.PI;
      pivot.add(cup);
      c._cup = cup;
      applySuction(c);
      parent = pivot;
      attachY = 0.38;
    }
  }
  updateJSONView();
  updateBOM();
  if (components.length) startHint.hidden = true; // рука уже не пуста
}

function applyGripper(c) {
  const gap = 0.05 + (c.open ?? 50) / 100 * 0.18;
  c._fingers[0].position.x = gap;
  c._fingers[1].position.x = -gap;
}

function applySuction(c) {
  const squash = 1 - (c.power ?? 0) / 100 * 0.45;
  c._cup.scale.y = squash;
  c._cup.position.y = 0.16 + 0.1 * squash;
}

/* Быстрое применение параметра без пересборки сцены;
   возвращает false, если нужна полная пересборка (link/offset) */
function applyParam3D(c) {
  if (c.type === 'yaw' || c.type === 'roll') {
    pivots[components.indexOf(c)].rotation.y = THREE.MathUtils.degToRad(c.angle);
  } else if (c.type === 'pitch') {
    c._rot.rotation.x = THREE.MathUtils.degToRad(c.angle);
  } else if (c.type === 'gripper') {
    applyGripper(c);
  } else if (c.type === 'prismatic') {
    c._rod.position.y = c.ext;
  } else if (c.type === 'spherical') {
    c._g1.rotation.y = THREE.MathUtils.degToRad(c.yaw ?? 0);
    c._g2.rotation.x = THREE.MathUtils.degToRad(c.pitch ?? 0);
  } else if (c.type === 'rail') {
    c._car.position.x = c.pos;
  } else if (c.type === 'suction') {
    applySuction(c);
  } else if (c.type === 'link' || c.type === 'offset') {
    /* длина меняет положение потомков — проще пересобрать */
    return false;
  }
  return true;
}

function applyParam(c) {
  if (!applyParam3D(c)) { buildArm(); return; }
  updateJSONView();
}

        if (c._zone) c._zone.visible = zoneToggle.checked;

      zoneLbl.appendChild(document.createTextNode(t('zone')));

    for (const p of ty.params) {
      const row = document.createElement('div');
      row.className = 'ctrl';
      const label = document.createElement('label');
      label.textContent = tr(p.label);
      const slider = document.createElement('input');
      slider.type = 'range';
      slider.min = p.min; slider.max = p.max; slider.step = p.step;
      slider.value = c[p.key] ?? p.def;
      const val = document.createElement('span');

      val.textContent = slider.value;

/* ================= Авто-кадрирование камеры ================= */

const _box = new THREE.Box3(), _tmpBox = new THREE.Box3(), _sphere = new THREE.Sphere();
const _frustum = new THREE.Frustum(), _projScreen = new THREE.Matrix4();

/* ограничивающая сфера видимой части руки */
function armSphere() {
  _box.makeEmpty();
  armRoot.updateWorldMatrix(true, true);
  armRoot.traverseVisible(o => {
    const g = o.geometry;
    if (!g) return;
    if (!g.boundingBox) g.computeBoundingBox();
    _tmpBox.copy(g.boundingBox).applyMatrix4(o.matrixWorld);
    _box.union(_tmpBox);
  });
  return _box.isEmpty() ? null : _box.getBoundingSphere(_sphere);
}

/* плавно отодвигает камеру, если рука вылезает за кадр (только наружу) */
function cameraAutoExpand() {
  const s = armSphere();
  if (!s) return;
  camera.updateMatrixWorld();
  _projScreen.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  _frustum.setFromProjectionMatrix(_projScreen);
  for (const plane of _frustum.planes) {
    if (plane.distanceToPoint(s.center) < s.radius * 0.92) {
      const dir = camera.position.clone().sub(controls.target);
      const dist = dir.length();
      if (dist < 80) {
        camera.position.copy(controls.target).addScaledVector(dir.normalize(), dist * 1.03);
      }
      return;
    }
  }
}

/* полный сброс кадра под текущую руку (после генерации) */
function fitCameraToArm() {
  const s = armSphere();
  if (!s) return;
  const vHalf = THREE.MathUtils.degToRad(camera.fov) / 2;
  const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const needed = s.radius * 1.15 / Math.sin(Math.min(vHalf, hHalf));
  controls.target.copy(s.center);
  const dir = new THREE.Vector3(1, 0.62, 1.25).normalize();
  camera.position.copy(s.center).addScaledVector(dir, Math.max(needed, 3.5));
}

/* ================= Генератор случайных рук ================= */

function rand(a, b) { return a + Math.random() * (b - a); }
function randi(a, b) { return Math.round(rand(a, b)); }
function randLen(a, b) { return +rand(a, b).toFixed(2); }

function generateArm() {
  const c = [];

  /* иногда — рельс в основании */
  if (Math.random() < 0.3) c.push({ type: 'rail', pos: randLen(-1.5, 1.5) });

  /* база: чаще турель-yaw, иногда шаровой шарнир */
  if (Math.random() < 0.8) c.push({ type: 'yaw', angle: randi(-90, 90) });
  else c.push({ type: 'spherical', pitch: randi(-30, 30), yaw: randi(-60, 60) });

  /* 2–4 секции руки в разных вариациях */
  const sections = randi(2, 4);
  for (let i = 0; i < sections; i++) {
    const r = Math.random();
    if (r < 0.5) {
      c.push({ type: 'pitch', angle: randi(-70, 70) });
      c.push({ type: 'link', length: randLen(0.6, 1.6) });
    } else if (r < 0.65) {
      c.push({ type: 'prismatic', ext: randLen(0.1, 1.1) });
    } else if (r < 0.78) {
      c.push({ type: 'spherical', pitch: randi(-45, 45), yaw: randi(-90, 90) });
      c.push({ type: 'link', length: randLen(0.5, 1.2) });
    } else if (r < 0.88) {
      c.push({ type: 'offset', length: randLen(0.3, 1.0) });
    } else {
      c.push({ type: 'roll', angle: randi(-90, 90) });
      c.push({ type: 'link', length: randLen(0.5, 1.2) });
    }
  }

  /* запястье */
  if (Math.random() < 0.6) c.push({ type: 'roll', angle: randi(-90, 90) });
  if (Math.random() < 0.5) c.push({ type: 'pitch', angle: randi(-45, 45) });

  /* концевой эффектор — не всегда */
  if (Math.random() < 0.85) {
    c.push(Math.random() < 0.6
      ? { type: 'gripper', open: randi(0, 100) }
      : { type: 'suction', power: randi(0, 100) });
  }

  components = c;
  buildArm();
  renderPanel();
  fitCameraToArm(); // сброс камеры — только при генерации новой руки
}

  yaw:       { nema17: 1, belt: 1, tmc2209: 1, endstop: 1, thrust: 1, bearings: 1, print: 1 },
  pitch:     { nema17: 1, gearbox: 1, tmc2209: 1, endstop: 1, bearings: 1, print: 1 },
  roll:      { nema14: 1, belt: 1, tmc2209: 1, endstop: 1, bearings: 1, print: 1 },
  spherical: { nema14: 2, belt: 1, tmc2209: 2, endstop: 2, bearings: 2, print: 1 },
  link:      { print: 1 },
  offset:    { print: 1 },
  prismatic: { nema17: 1, leadscrew: 1, linrail: 1, bearings: 1, tmc2209: 1, endstop: 1, print: 1 },
  rail:      { linrail: 1, nema17: 1, belt: 1, bearings: 1, tmc2209: 1, endstop: 1, print: 1 },
  gripper:   { nema14: 1, leadscrew: 1, bearings: 1, tmc2209: 1, endstop: 1, print: 1 },
  suction:   { pump: 1, valve: 1, relay: 1, cup: 1, print: 1 },
};

/* выбранные замены: базовый ключ → ключ альтернативы */
const swaps = {};
function usedPart(key) { return swaps[key] || key; }
const bomTable = document.getElementById('bomTable');
const armNameEl = document.getElementById('armName');

/* название руки в принятой номенклатуре: «N-осевой манипулятор с захватом» */
function armName() {
  if (!components.length) return { ru: 'Пустая конфигурация', en: 'Empty configuration' };

  const AXES = { yaw: 1, pitch: 1, roll: 1, prismatic: 1, spherical: 2 };
  let axes = 0, rails = 0, grippers = 0, suctions = 0;
  for (const c of components) {
    axes += AXES[c.type] ?? 0;
    if (c.type === 'rail') rails++;
    if (c.type === 'gripper') grippers++;
    if (c.type === 'suction') suctions++;
  }

  let ru, en;
  if (axes === 0) { ru = 'Статическая конструкция'; en = 'Static structure'; }
  else { ru = `${axes}-осевой манипулятор`; en = `${axes}-axis manipulator`; }

  if (rails) { ru += ' на линейном рельсе'; en += ' on linear rail'; }

  if (grippers && suctions) { ru += ' с захватом и вакуумной присоской'; en += ' with gripper and suction cup'; }
  else if (grippers) { ru += ' с захватом'; en += ' with gripper'; }
  else if (suctions) { ru += ' с вакуумным схватом'; en += ' with vacuum suction cup'; }
  else if (axes > 0) { ru += ' без концевого эффектора'; en += ' without end effector'; }

  return { ru, en };
}

function fmt$(v) { return '$' + (Math.round(v * 100) / 100).toLocaleString('en-US'); }

/* Группы закупки: одна на каждый тип компонента в руке + базовый комплект.
   Порядок групп — как в руке, от основания к концу. */
function bomGroups() {
  const byType = new Map();
  for (const c of components) {
    const needs = NEEDS[c.type];
    if (!needs) continue;
    let g = byType.get(c.type);
    if (!g) byType.set(c.type, g = { label: tr(TYPES[c.type].label), count: 0, parts: {} });
    g.count++;
    for (const [key, n] of Object.entries(needs)) g.parts[key] = (g.parts[key] || 0) + n;
  }
  const groups = [...byType.values()];
  if (components.length) {
    /* базовая электроника — один комплект на руку, по конденсатору на драйвер */
    const drivers = groups.reduce((s, g) => s + (g.parts.tmc2209 || 0), 0);
    const parts = { esp32: 1, buck: 1, psu: 1, hw: 1 };
    if (drivers) parts.cap = drivers;
    groups.push({ label: t('bomBase'), count: 1, parts });
  }
  return groups;
}

/* Ячейка названия: список замен, если они есть для этой детали */
function partCell(key) {
  const use = usedPart(key);
  if (!ALTS[key]) return tr(PARTS[use]);
  const opts = [key, ...ALTS[key]]
    .map(k => `<option value="${k}"${k === use ? ' selected' : ''}>${tr(PARTS[k])}</option>`)
    .join('');
  return `<select data-part="${key}"${use === key ? '' : ' class="swapped"'}
    title="${t('bomAltTip')}">${opts}</select>`;
}

function updateBOM() {
  const name = armName();
  armNameEl.textContent = `🦾 ${tr(name)}`;

  const groups = bomGroups();
  if (!groups.length) {
    bomTable.innerHTML = `<tr><td>${t('bomEmpty')}</td></tr>`;
    return;
  }

  let html = `<tr>
    <th>${t('colName')}</th>
    <th class="num">${t('colQty')}</th>
    <th class="num">${t('colPrice')}</th>
    <th class="num">${t('colSum')}</th>
  </tr>`;
  let total = 0;

  for (const g of groups) {
    let rows = '', sub = 0;
    for (const key of Object.keys(PARTS)) {
      const n = g.parts[key];
      if (!n) continue;
      const price = PARTS[usedPart(key)].price;
      sub += n * price;
      rows += `<tr>
        <td>${partCell(key)}</td>
        <td class="num">${n}</td>
        <td class="num">${fmt$(price)}</td>
        <td class="num">${fmt$(n * price)}</td>
      </tr>`;
    }
    if (!rows) continue;
    total += sub;
    html += `<tr class="group">
      <td colspan="3">${g.label}${g.count > 1 ? ` <span class="mult">×${g.count}</span>` : ''}</td>
      <td class="num">${fmt$(sub)}</td>
    </tr>${rows}`;
  }

  html += `<tr class="total">
    <td colspan="3">${t('total')}</td>
    <td class="num">${fmt$(total)}</td>
  </tr>`;
  bomTable.innerHTML = html;

  for (const sel of bomTable.querySelectorAll('select')) {
    sel.onchange = () => {
      const key = sel.dataset.part;
      if (sel.value === key) delete swaps[key]; else swaps[key] = sel.value;
      updateBOM();
    };
  }
}

/* ================= JSON ================= */

const jsonText = document.getElementById('jsonText');
const jsonStatus = document.getElementById('jsonStatus');

function cleanConfig() {
  return components.map(c => {
    const out = { type: c.type };
    for (const p of TYPES[c.type].params) out[p.key] = c[p.key] ?? p.def;
    return out;
  });
}

function updateJSONView() {
  if (document.activeElement === jsonText) return; // не мешаем ручному редактированию
  jsonText.value = JSON.stringify(cleanConfig(), null, 2);
}

function setStatus(text, cls) {
  jsonStatus.textContent = text;
  jsonStatus.className = cls || '';
  if (text) setTimeout(() => { if (jsonStatus.textContent === text) { jsonStatus.textContent = ''; jsonStatus.className = ''; } }, 3000);
}

/* Валидация конфигурации (Apply и ?config= из URL): неизвестный тип — ошибка,
   значения зажимаются в min/max, пропущенные параметры добираются из def */
function validateConfig(data) {
  if (!Array.isArray(data)) throw new Error(t('errArray'));
  for (const [i, c] of data.entries()) {
    if (!c || !TYPES[c.type]) throw new Error(t('errType', i + 1, c && c.type));
    for (const p of TYPES[c.type].params) {
      if (c[p.key] === undefined) c[p.key] = p.def;
      c[p.key] = Math.min(p.max, Math.max(p.min, +c[p.key] || 0));
    }
  }
  return data;
}

document.getElementById('btnApply').onclick = () => {
  try {
    components = validateConfig(JSON.parse(jsonText.value));
    buildArm();
    renderPanel();
    setStatus(t('applied'), 'ok');
  } catch (e) {
    setStatus(t('errPrefix', e.message), 'err');
  }
};

/* Копирование в буфер: clipboard API → временная textarea (execCommand;
   выделять #jsonText нельзя — на мобильных его вкладка скрыта и select()
   не срабатывает) → системная шторка «Поделиться», если и это не вышло */
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { /* дальше фолбэк */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.readOnly = true;
  /* font-size 16px — iOS не зумит страницу при фокусе */
  ta.style.cssText = 'position:fixed;left:0;top:0;opacity:0;font-size:16px';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  ta.setSelectionRange(0, text.length); // iOS игнорирует select()
  let ok = false;
  try { ok = document.execCommand('copy'); } catch { /* нет execCommand */ }
  ta.remove();
  if (!ok && navigator.share) {
    try {
      await navigator.share(/^https?:/.test(text) ? { url: text } : { text });
      ok = true;
    } catch { /* пользователь закрыл шторку */ }
  }
  return ok;
}

document.getElementById('btnCopy').onclick = async () => {
  if (await copyText(jsonText.value)) setStatus(t('copied'), 'ok');
};

/* ---- Ссылка на текущую конфигурацию: base64url(JSON) в параметре ?config= ---- */

function shareURL() {
  const b64 = btoa(JSON.stringify(cleanConfig()))
    .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  return `${SHARE_BASE}?config=${b64}`;
}

const btnShare = document.getElementById('btnShare');
btnShare.onclick = async () => {
  if (!await copyText(shareURL())) return; // ссылка сразу уходит в буфер обмена
  btnShare.textContent = t('shareCopied');
  btnShare.classList.add('done');
  setTimeout(() => {
    btnShare.textContent = t('share');
    btnShare.classList.remove('done');
  }, 2000);
};

/* Восстановление руки из ?config= (или #config=) при открытии по ссылке */
function loadFromURL() {
  try {
    const q = new URLSearchParams(location.search).get('config')
      || new URLSearchParams(location.hash.replace(/^#\??/, '')).get('config');
    if (!q) return false;
    const b64 = q.replace(/-/g, '+').replace(/_/g, '/');
    components = validateConfig(JSON.parse(atob(b64)));
    return true;
  } catch {
    return false; // битый параметр — остаётся стартовая рука
  }
}

/* ================= Animate ================= */

const chkAnimate = document.getElementById('chkAnimate');
let lastJsonSync = 0;

/* подсветка кнопки в такт состоянию: включённая анимация видна сразу */
function syncAnimToggle() {
  document.getElementById('animToggle').classList.toggle('on', chkAnimate.checked);
}

chkAnimate.onchange = () => {
  syncAnimToggle();
  if (chkAnimate.checked) {
    /* анимация качается вокруг текущих поз */
    for (const c of components) delete c._animBase;
  } else {
    updateJSONView(); // зафиксировать финальные значения
  }
};

function animateArm(now) {
  const t = now / 1000;
  components.forEach((c, i) => {
    if (c.type === 'link' || c.type === 'offset') return; // статика: без пересборки
    const params = TYPES[c.type].params;
    if (!c._animBase) {
      c._animBase = {};
      for (const p of params) c._animBase[p.key] = c[p.key] ?? p.def;
    }
    for (const [j, p] of params.entries()) {
      const base = c._animBase[p.key];
      const amp = (p.max - p.min) * 0.25;
      const speed = 0.5 + ((i * 2 + j) % 4) * 0.22;
      let v = base + amp * Math.sin(t * speed + i * 1.3 + j * 2.1);
      v = Math.min(p.max, Math.max(p.min, v));
      c[p.key] = p.step >= 1 ? Math.round(v) : +v.toFixed(2);
      const s = c._sliders?.[p.key];
      if (s) { s.slider.value = c[p.key]; s.val.textContent = c[p.key]; }
    }
    applyParam3D(c);
  });
  if (now - lastJsonSync > 300) { lastJsonSync = now; updateJSONView(); }
}

/* ================= Применение темы ================= */

/* Обновляет сцену и состояние переключателя; рука перекрашивается пересборкой */
function applyTheme() {
  SCN = SCENE_THEME[theme];
  document.documentElement.dataset.theme = theme;
  scene.background.setHex(SCN.bg);
  scene.fog.color.setHex(SCN.bg);
  ground.material.color.setHex(SCN.ground);
  hemi.color.setHex(SCN.hemiSky);
  hemi.groundColor.setHex(SCN.hemiGround);
  hemi.intensity = SCN.hemiInt;
  sun.intensity = SCN.sunInt;
  scene.remove(grid);
  grid.geometry.dispose();
  grid.material.dispose();
  grid = makeGrid();
  scene.add(grid);
  for (const b of document.querySelectorAll('#themeSw button')) {
    b.classList.toggle('active', b.dataset.theme === theme);
  }
}

function setTheme(th) {
  if (!THEMES.includes(th) || th === theme) return;
  theme = th;
  try { localStorage.setItem(THEME_KEY, th); } catch { /* file:// без хранилища */ }
  applyTheme();
  buildArm(); // цвета деталей берутся из SCN при сборке
}

for (const b of document.querySelectorAll('#themeSw button')) {
  b.onclick = () => setTheme(b.dataset.theme);
}

/* ================= Применение языка ================= */

const TAB_STR = { components: 'tabParts', jsonarea: 'tabJson', bom: 'tabBom' };

/* Статические подписи + перерисовка кнопок добавления */
function applyI18n() {
  document.documentElement.lang = lang;
  document.title = t('docTitle');
  document.getElementById('appTitle').textContent = t('appTitle');
  document.getElementById('version').textContent = 'v' + VERSION;
  for (const b of document.querySelectorAll('#themeSw button')) {
    b.title = t(b.dataset.theme === 'dark' ? 'themeDark' : 'themeLight');
  }
  document.getElementById('hint').textContent = t('hint');
  document.getElementById('animLbl').textContent = t('animate');
  document.getElementById('animToggle').title = t('animateTip');
  document.getElementById('btnGenerate').textContent = t('generate');
  const btnNew = document.getElementById('btnNew');
  btnNew.textContent = t('newProject');
  btnNew.title = t('newTip');
  document.getElementById('jsonTitle').textContent = t('jsonTitle');
  document.getElementById('btnApply').textContent = t('apply');
  document.getElementById('btnCopy').textContent = t('copy');
  const btnShare = document.getElementById('btnShare');
  btnShare.textContent = t('share');
  btnShare.title = t('shareTip');
  document.getElementById('bomTitle').textContent = t('bomTitle');
  document.getElementById('bomNote').textContent = t('bomNote');
  startHint.textContent = t('startHint');
  for (const b of document.querySelectorAll('#tabs button')) b.textContent = t(TAB_STR[b.dataset.tab]);
  for (const b of document.querySelectorAll('#langSw button')) b.classList.toggle('active', b.dataset.lang === lang);
  renderAddRow();
}

/* Смена языка: подписи + производные представления (карточки, BOM) */
function setLang(l) {
  if (!LANGS.includes(l) || l === lang) return;
  lang = l;
  try { localStorage.setItem(LANG_KEY, l); } catch { /* file:// без хранилища */ }
  applyI18n();
  renderPanel();
  updateBOM();
}

for (const b of document.querySelectorAll('#langSw button')) {
  b.onclick = () => setLang(b.dataset.lang);
}

/* ================= Запуск ================= */

applyI18n();
applyTheme();
syncAnimToggle();
const fromLink = loadFromURL(); // рука из ?config= — раньше первой сборки
buildArm();
renderPanel();
if (fromLink) fitCameraToArm();

renderer.setAnimationLoop((now) => {
  if (chkAnimate.checked) animateArm(now);
  controls.update();
  cameraAutoExpand();
  renderer.render(scene, camera);
});
</script>
